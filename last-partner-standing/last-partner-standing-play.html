<style>
:root{
  --paper:#E3EDE1;
  --paper-2:#D7E4D5;
  --sheet:#F8FBF6;
  --sheet-2:#EEF4EC;
  --ink:#15241C;
  --ink-2:#4A5E52;
  --ink-3:#6F8577;
  --rule:#BCCFBF;
  --accent:#1D6A4D;
  --accent-ink:#F4FAF6;
  --accent-soft:#CFE5D8;
  --stamp:#BF3A2C;
  --stamp-soft:#F6D9D4;
  --hilite:#F2D449;
  --good:#2C8656;
  --warn:#C27C12;
  --bad:#BF3A2C;
  --hatch:rgba(29,106,77,.055);
  --s1:#1D6A4D;--s2:#C27C12;--s3:#BF3A2C;--s4:#3563A8;
  --shadow:0 1px 0 rgba(21,36,28,.06),0 10px 28px -14px rgba(21,36,28,.35);
  --display:"Bricolage Grotesque","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0D1712;--paper-2:#122019;--sheet:#15241C;--sheet-2:#1B2D24;
    --ink:#DCE9E0;--ink-2:#A2B8AA;--ink-3:#7F968A;--rule:#2B4135;
    --accent:#5CBF90;--accent-ink:#08140E;--accent-soft:#1F3E30;
    --stamp:#F07C6E;--stamp-soft:#3E1F1B;--hilite:#E6C84A;
    --good:#5CBF90;--warn:#E3A43E;--bad:#F07C6E;--hatch:rgba(92,191,144,.045);--s1:#5CBF90;--s2:#E3A43E;--s3:#F07C6E;--s4:#86AEE8;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0D1712;--paper-2:#122019;--sheet:#15241C;--sheet-2:#1B2D24;
  --ink:#DCE9E0;--ink-2:#A2B8AA;--ink-3:#7F968A;--rule:#2B4135;
  --accent:#5CBF90;--accent-ink:#08140E;--accent-soft:#1F3E30;
  --stamp:#F07C6E;--stamp-soft:#3E1F1B;--hilite:#E6C84A;
  --good:#5CBF90;--warn:#E3A43E;--bad:#F07C6E;--hatch:rgba(92,191,144,.045);--s1:#5CBF90;--s2:#E3A43E;--s3:#F07C6E;--s4:#86AEE8;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 9px);
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hilite);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.08;text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
#app{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-inline:16px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:1.5px solid var(--ink);
  background:var(--sheet);border-radius:999px;padding:.62em 1.2em;font-weight:700;line-height:1.1;
  transition:transform .12s ease,background .12s ease,box-shadow .12s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{box-shadow:0 3px 0 var(--ink)}
.btn.ghost{border-color:var(--rule);background:transparent}
.btn.small{padding:.4em .85em;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 .35em;opacity:.7}

/* ---------- title screen ---------- */
.title-screen{flex:1;padding-block:clamp(24px,6vh,64px) 48px}
.title-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,4vw,56px);align-items:start}
.logo{font-size:clamp(46px,8.2vw,104px);font-weight:800;letter-spacing:-.035em;line-height:.88;font-variation-settings:"opsz" 96}
.logo .rx{display:inline-block;font-family:var(--mono);font-weight:600;font-size:.3em;letter-spacing:0;vertical-align:.95em;color:var(--stamp);border:2px solid var(--stamp);border-radius:6px;padding:.05em .3em;transform:rotate(-8deg);margin-left:.15em}
.logo .under{display:inline-block;padding:0 .04em .1em;background:linear-gradient(var(--hilite),var(--hilite)) left bottom/100% .13em no-repeat;border-radius:2px}
.tagline{font-size:clamp(17px,2vw,20px);max-width:34ch;margin-top:22px;color:var(--ink-2)}
.memo{margin-top:26px;max-width:52ch;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);font-size:15px}
.memo ul{margin:.4em 0 0;padding-left:1.1em;display:grid;gap:.25em}
.setup{background:var(--sheet);border:1.5px solid var(--ink);border-radius:14px;padding:22px;box-shadow:var(--shadow);display:grid;gap:18px}
.setup label.field{display:grid;gap:6px;font-weight:700}
.name-row{display:flex;align-items:center;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet-2);overflow:hidden}
.name-row span{padding:.55em .7em;font-family:var(--mono);color:var(--ink-2);border-right:1px solid var(--rule)}
.name-row input{flex:1;min-width:0;border:0;background:transparent;padding:.55em .7em;outline:none}
.pcards{display:grid;gap:10px}
.pcard{text-align:left;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.pcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.pcard b{font-family:var(--display);font-size:18px}
.pcard .diff{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;align-self:center}
.pcard .d{grid-column:1/-1;font-size:14px;color:var(--ink-2)}
.pcard .facts{grid-column:1/-1;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.maker{display:flex;gap:16px;align-items:center}
.portrait.big{width:96px;height:96px;border-radius:16px}
.maker-picks{display:grid;gap:10px;min-width:0}
.looks{display:flex;flex-wrap:wrap;gap:6px}
.look{padding:0;border:2px solid transparent;border-radius:10px;background:none;line-height:0;cursor:pointer}
.look svg{border-radius:8px}
.look[aria-pressed="true"]{border-color:var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:26px;height:26px;border-radius:50%;background:var(--sw);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--rule);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.name-row .dice{border:0;border-left:1px solid var(--rule);background:transparent;color:var(--ink-2);padding:0 .7em;cursor:pointer;align-self:stretch;display:grid;place-items:center}
.name-row .dice:hover{color:var(--ink)}
@media (max-width:640px){.maker{align-items:flex-start}.portrait.big{width:76px;height:76px}.look svg{width:34px;height:34px}}
.front{margin:0 0 18px;border-radius:14px;overflow:hidden;border:1.5px solid var(--ink);box-shadow:var(--shadow);background:#1B2433}
.facade{display:block;width:100%;height:auto}
@media (min-width:900px){.plan-top{display:grid;grid-template-columns:minmax(0,500px) 1fr;gap:28px;align-items:start;margin-bottom:10px}.plan-top .front{margin:0}.plan-top .plan-head{display:grid;gap:14px;align-content:start}}
.fwin{cursor:pointer;outline:none}
.fwin:not(.still):hover > rect:first-child,.fwin:not(.still):focus-visible > rect:first-child{fill:#F2D449}
.fwin.still{cursor:default}
.brass{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:9px 14px;background:linear-gradient(#C9A24B,#A8812F);color:#2B1F0C;font-family:Georgia,'Times New Roman',serif;font-size:14px;border-top:1.5px solid #6B5220}
.brass b{font-weight:700}
.brass i{font-style:normal;opacity:.6}
.brass s{opacity:.55}
.brass-t{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.brass-cqc{margin-left:auto;font-family:var(--mono);font-size:11.5px}
.front-hint{margin:0;padding:6px 14px 8px;background:#1B2433;color:#C9CFDA;font-size:12.5px}
.lede-s{font-size:17px}
@media (max-width:640px){.front{margin:0 -4px 14px;border-radius:12px}.brass{font-size:13px;padding:8px 12px}}
.front-end{max-width:560px;margin:0 auto 18px}
.brief-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}
.btile{background:var(--sheet);border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.btile span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.btile b{font-family:var(--display);font-size:22px;line-height:1.1}
.carry-on{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px 20px;margin:0 0 18px}
.carry-on p{margin:4px 0 0;opacity:.9;max-width:52ch}
.carry-on b{font-family:var(--display);font-size:20px}
.carry-on .btn.primary{background:#F2D449;color:#15241C;border-color:#F2D449}
.honours{background:linear-gradient(#5A3B24,#4A2F1C);border:3px solid #2E1D10;border-radius:10px;padding:14px 16px 12px;color:#EAD9A8;box-shadow:inset 0 0 0 1px #7A5634;margin:14px 0}
.honours-h{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:20px;text-align:center;color:#E4C66E;letter-spacing:.02em}
.honours-h small{display:block;font-weight:400;font-style:italic;font-size:13px;color:#CDB889}
.honours-empty{text-align:center;font-family:Georgia,serif;font-style:italic;margin:8px 0 2px}
.plqs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.plq{display:grid;grid-template-columns:22px 40px 1fr auto;align-items:center;gap:10px;padding:6px 8px;border-top:1px solid rgba(228,198,110,.25)}
.plq.me{background:rgba(228,198,110,.14);border-radius:6px}
.plq-n{font-family:var(--mono);font-size:12px;color:#CDB889;text-align:right}
.portrait.sm{width:40px;height:40px;border-radius:8px}
.plq-t{display:grid;min-width:0;font-family:Georgia,'Times New Roman',serif}
.plq-t b{color:#F2E3B4;font-size:15.5px}
.plq-t small{color:#CDB889;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.plq-m{font-family:var(--mono);font-weight:600;font-size:18px;color:#E4C66E;text-align:right;line-height:1}
.plq-m small{display:block;font-size:10px;font-weight:400;color:#CDB889}
.share-img{display:block;width:100%;height:auto;border-radius:10px;margin:10px 0}
@media (max-width:640px){.brief-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.btile b{font-size:19px}}
.setup-actions{display:flex;flex-wrap:wrap;gap:10px}
.best{font-size:14px;color:var(--ink-2)}
.best li{font-family:var(--mono);font-size:12.5px}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.hud-top{display:flex;align-items:center;gap:14px;padding-block:10px 6px;flex-wrap:wrap}
.hud-name{font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap}
.hud-sub{font-size:13px;color:var(--ink-2)}
.months{display:flex;gap:3px;margin-left:auto;align-items:flex-end}
.months i{display:block;width:clamp(14px,2.4vw,26px);height:6px;border-radius:2px;background:var(--rule)}
.months i.done{background:var(--accent)}
.months i.now{background:var(--hilite);height:10px}
.month-label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.icon-btn{border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;width:34px;height:34px;display:grid;place-items:center}
.meters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding-block:4px 10px}
.meter{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;position:relative;min-width:0}
.meter svg{width:20px;height:20px;grid-row:span 2}
.meter .lab{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:6px;min-width:0}
.meter .lab span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .val{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--paper-2);border:1px solid var(--rule);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1),background .3s}
.meter.low .bar b{background:var(--warn)}
.meter.crit .bar b{background:var(--bad)}
.meter.crit .val{color:var(--bad)}
.meter .hint{position:absolute;top:-7px;left:6px;width:10px;height:10px;border-radius:50%;background:var(--ink);opacity:0;transform:scale(.3);transition:.15s}
.meter .hint.on{opacity:1;transform:scale(1)}
.meter .hint.big{width:14px;height:14px;top:-9px;left:4px}
.meter.pulse-up .bar{box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 45%,transparent)}
.meter.pulse-down .bar{box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 45%,transparent)}
.ledger{display:flex;flex-wrap:wrap;gap:6px 18px;padding-block:0 10px;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.ledger b{color:var(--ink);font-weight:600}
.ledger .warnv{color:var(--warn)}
.ledger .badv{color:var(--bad)}

/* ---------- stage ---------- */
.stage{flex:1;padding-block:22px 48px}
.card{
  position:relative;max-width:640px;margin:0 auto;background:var(--sheet);border:1.5px solid var(--ink);border-radius:14px;
  box-shadow:var(--shadow);padding:22px clamp(18px,3vw,30px) 24px;animation:deal .38s cubic-bezier(.2,.8,.2,1)
}
.card::before{content:"";position:absolute;inset:8px auto 8px 8px;width:2px;background:repeating-linear-gradient(to bottom,var(--stamp) 0 6px,transparent 6px 10px);opacity:.35;border-radius:2px}
@keyframes deal{from{transform:translateY(14px) rotate(-.6deg);opacity:0}to{transform:none;opacity:1}}
.who{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mono-badge{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;color:#fff;letter-spacing:.02em;border:2px solid var(--ink)}
.portrait{flex:none;width:52px;height:52px;border-radius:12px;box-shadow:0 0 0 2.5px var(--ring,var(--ink)),0 2px 6px rgba(0,0,0,.18);overflow:hidden;line-height:0}
.portrait svg{display:block;width:100%;height:100%}
.who b{display:block;font-size:16px;line-height:1.2}
.who small{color:var(--ink-2);font-size:13px}
.card .stampno{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--stamp);border:1.5px solid var(--stamp);border-radius:5px;padding:2px 7px;transform:rotate(3deg);white-space:nowrap}
.card h2{font-size:clamp(24px,3.4vw,32px);font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.card .text{font-size:17px;max-width:60ch}
.card .text p+p{margin-top:.6em}
.choices{display:grid;gap:10px;margin-top:20px}
.choice{
  text-align:left;border:1.5px solid var(--ink);background:var(--sheet-2);border-radius:10px;padding:12px 14px;display:grid;gap:6px;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease
}
.choice:hover:not([disabled]),.choice:focus-visible{transform:translateX(3px);box-shadow:-4px 0 0 var(--accent);background:var(--sheet)}
.choice[disabled]{opacity:.5;cursor:not-allowed}
.choice .t{font-weight:700;font-size:16px}
.choice .why{font-size:13px;color:var(--stamp)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);border:1px solid var(--rule);border-radius:99px;padding:1px 8px 1px 5px;background:var(--sheet)}
.chip svg{width:14px;height:14px}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-2)}
.chip .dot.big{width:10px;height:10px}
.chip.risk{border-style:dashed;color:var(--stamp);border-color:var(--stamp)}
.outcome .text{font-size:17px}
.deltas{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.delta{font-family:var(--mono);font-size:13px;font-weight:600;border-radius:6px;padding:3px 9px;border:1.5px solid}
.delta.up{color:var(--good);border-color:var(--good)}
.delta.down{color:var(--bad);border-color:var(--bad)}
.delta.neutral{color:var(--ink-2);border-color:var(--rule)}
.card-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.card-foot .muted{margin-right:auto;font-size:13px}

/* ---------- planning ---------- */
.plan-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:18px}
.plan-head h1{font-size:clamp(30px,4.6vw,48px);font-weight:800;letter-spacing:-.03em}
.brief{flex:1 1 320px;font-size:15px;color:var(--ink-2);border-left:3px solid var(--hilite);padding-left:12px}
.plan-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:18px;align-items:start}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;display:grid;gap:12px}
.panel h3{font-size:19px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel h3 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--ink-2)}
.col{display:grid;gap:14px}
.steps{display:grid;gap:8px}
.step{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--rule)}
.step:last-child{border-bottom:0}
.step .l b{display:block}
.step .l small{color:var(--ink-2);font-size:13px}
.stepper{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--sheet-2)}
.stepper button{width:34px;height:32px;border:0;background:transparent;font-weight:700;font-size:18px;line-height:1}
.stepper button:hover:not([disabled]){background:var(--accent-soft)}
.stepper button[disabled]{opacity:.3;cursor:not-allowed}
.stepper output{min-width:30px;text-align:center;font-family:var(--mono);font-weight:600}
.sessbar{display:flex;gap:3px;flex-wrap:wrap}
.sessbar i{width:22px;height:14px;border-radius:3px;border:1px solid var(--ink-2)}
.sessbar i.c{background:var(--accent)}
.sessbar i.a{background:var(--hilite)}
.sessbar i.m{background:var(--stamp)}
.sessbar i.over{outline:2px solid var(--bad);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;background:var(--sheet-2);padding:.4em .9em;font-size:14px;font-weight:700}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.proj{text-align:left;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px;display:grid;gap:3px;align-content:start}
.proj b{font-size:14.5px}
.proj small{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.proj[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.proj[disabled]{opacity:.45;cursor:not-allowed}
.roles{display:grid;gap:0}
.role{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--rule)}
.role:last-child{border-bottom:0}
.role .l b{font-size:14.5px}
.role .l small{display:block;font-size:12px;color:var(--ink-2);line-height:1.3}
.role .n{font-family:var(--mono);font-weight:600;min-width:2ch;text-align:right}
.role .acts{display:flex;gap:5px}
.role .acts button{font-size:12.5px;padding:.3em .65em;border-radius:99px;border:1.5px solid var(--ink);background:var(--sheet-2);font-weight:700}
.role .acts button[disabled]{opacity:.35;cursor:not-allowed}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 5px;vertical-align:1px;margin-left:4px}
.tag.arrs{background:var(--accent-soft);color:var(--accent)}
.tag.vac{background:var(--hilite);color:#2b2300}
.forecast{position:sticky;top:150px}
.fc-row{display:grid;gap:5px}
.fc-row .top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.fc-row .top b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gauge{position:relative;height:12px;background:var(--paper-2);border-radius:99px;border:1px solid var(--rule);overflow:hidden}
.gauge b{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px;transition:width .3s}
.gauge i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.gauge.warn b{background:var(--warn)}
.gauge.bad b{background:var(--bad)}
.fc-note{font-size:12.5px;color:var(--ink-2)}
.good-t{color:var(--good)}.warn-t{color:var(--warn)}.bad-t{color:var(--bad)}
.plan-go{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-top:16px}
.go-pair{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- report ---------- */
.report{max-width:860px;margin:0 auto;display:grid;gap:16px}
.clip{background:var(--sheet);border:1px solid var(--rule);padding:16px 20px 18px;border-radius:4px;box-shadow:var(--shadow);transform:rotate(-.4deg)}
.clip .masthead{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-bottom:3px double var(--ink);padding-bottom:6px;display:flex;justify-content:space-between;gap:10px}
.clip h2{font-size:clamp(24px,3.6vw,36px);font-weight:800;letter-spacing:-.02em;margin-top:10px}
.clip p{margin-top:6px;color:var(--ink-2);font-style:italic}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14.5px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.kv .sum{border-top:1.5px solid var(--ink);padding-top:4px;font-weight:700;color:var(--ink)}
.notes{margin:0;padding-left:1.1em;display:grid;gap:5px;font-size:14.5px}
.statlines{display:grid;gap:8px}
.statline{display:grid;grid-template-columns:22px 90px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.statline svg{width:18px;height:18px}
.statline .d{font-family:var(--mono);text-align:right}

/* ---------- mini games ---------- */
.mini{max-width:720px;margin:0 auto;display:grid;gap:14px}
.mini-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mini-top h2{font-size:28px;font-weight:800}
.mini-score{margin-left:auto;font-family:var(--mono);font-size:14px;display:flex;gap:14px}
.timer{height:10px;border-radius:99px;background:var(--paper-2);border:1px solid var(--rule);overflow:hidden}
.timer b{display:block;height:100%;background:var(--accent);transition:width .1s linear}
.timer.hurry b{background:var(--bad)}
.doc{background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;padding:18px 20px;min-height:170px;box-shadow:var(--shadow);animation:slide .22s ease-out;position:relative}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.doc .kind{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:10px}
.doc .body{font-family:var(--mono);font-size:15.5px;line-height:1.55}
.doc.sms{border-radius:18px 18px 18px 4px}
.doc .fb{position:absolute;right:12px;bottom:10px;font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px}
.doc .fb.ok{background:var(--accent-soft);color:var(--good)}
.doc .fb.no{background:var(--stamp-soft);color:var(--bad)}
.bins{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:8px}
.bin{border:1.5px solid var(--ink);border-radius:10px;background:var(--sheet-2);padding:10px 6px;display:grid;justify-items:center;gap:3px;font-weight:700;font-size:14px;text-align:center;line-height:1.2}
.bin small{font-weight:400;font-size:11.5px;color:var(--ink-2)}
.bin:hover{background:var(--accent-soft)}
.bin.flash-ok{background:var(--accent-soft);border-color:var(--good)}
.bin.flash-no{background:var(--stamp-soft);border-color:var(--bad)}
.mini-intro{display:grid;gap:12px}
.mini-intro ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.lastfb{font-size:14px;min-height:1.5em;color:var(--ink-2)}
.lastfb b.ok{color:var(--good)} .lastfb b.no{color:var(--bad)}

/* ---------- ending ---------- */
.ending{max-width:860px;margin:0 auto;display:grid;gap:18px}
.verdict{background:var(--sheet);border:1.5px solid var(--ink);border-radius:16px;padding:clamp(20px,4vw,36px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.verdict .eyebrow{margin-bottom:8px}
.verdict h1{font-size:clamp(38px,7vw,76px);font-weight:800;letter-spacing:-.035em;line-height:.95}
.verdict p.lede{font-size:18px;margin-top:14px;max-width:58ch}
.verdict .bigstamp{position:absolute;right:clamp(10px,3vw,30px);top:clamp(10px,3vw,26px);font-family:var(--mono);font-weight:600;color:var(--stamp);border:3px solid var(--stamp);border-radius:8px;padding:4px 10px;transform:rotate(9deg);font-size:clamp(12px,1.6vw,15px);letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.verdict.over{border-color:var(--bad)}
.score{font-family:var(--mono);font-size:15px;margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 20px}
.score b{font-size:22px}
.cqc-card{border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;margin-top:14px}
.cqc-card .row{display:grid;grid-template-columns:1fr auto;padding:6px 12px;border-bottom:1px solid var(--rule);font-size:14px}
.cqc-card .row:last-child{border-bottom:0}
.cqc-card .overall{background:var(--ink);color:var(--sheet);font-weight:700}
.rate{font-family:var(--mono);font-size:12.5px;font-weight:600}
.rate.o{color:var(--good)} .rate.g{color:var(--accent)} .rate.ri{color:var(--warn)} .rate.i{color:var(--bad)}
.cqc-card .overall .rate{color:inherit}
.chart{width:100%;height:auto;display:block}
.end-actions{display:flex;flex-wrap:wrap;gap:10px}

/* ---------- overlay / toast ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,20,15,.45);display:grid;place-items:center;padding:16px}
.dialog{background:var(--sheet);border:1.5px solid var(--ink);border-radius:14px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:20px 22px;box-shadow:var(--shadow);display:grid;gap:12px}
.dialog h2{font-size:24px;font-weight:800}
.dialog ul{margin:0;padding-left:1.1em;display:grid;gap:5px;font-size:15px}
.dialog .row-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:99px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- explainers ---------- */
details.explain{border-top:1px dashed var(--rule);padding-top:8px}
details.explain>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--accent);padding:2px 0;border-radius:6px}
details.explain>summary::-webkit-details-marker{display:none}
details.explain>summary::before{content:"";flex:none;width:16px;height:16px;border:1.5px solid currentColor;border-radius:50%;background:
  linear-gradient(currentColor,currentColor) center/8px 1.5px no-repeat,linear-gradient(currentColor,currentColor) center/1.5px 8px no-repeat;transition:transform .2s ease}
details.explain[open]>summary::before{background:linear-gradient(currentColor,currentColor) center/8px 1.5px no-repeat;transform:rotate(180deg)}
details.explain>summary:hover{text-decoration:underline;text-underline-offset:3px}
.explain-body{padding:8px 0 4px 24px;font-size:14px;color:var(--ink-2);display:grid;gap:8px;max-width:68ch}
.explain-body b{color:var(--ink)}
details.explain.real{margin-top:14px;border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--sheet-2)}
details.explain.real>summary{color:var(--ink)}
.srcs{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12.5px}
.srcs li{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.srcs a{color:var(--accent);text-underline-offset:2px;overflow-wrap:anywhere}
.grade{font-family:var(--mono);font-size:10.5px;font-weight:600;border:1px solid var(--rule);border-radius:4px;padding:0 4px;color:var(--ink-2)}
.card-title-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card-title-row h2{margin-bottom:0;flex:1 1 auto}
.tagpill{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:3px 9px;border:1.5px solid;margin-top:6px}
.tagpill.t-real{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.tagpill.t-rule{color:var(--ink);border-color:var(--ink)}
.tagpill.t-story{color:var(--ink-3);border-color:var(--rule)}
.tagpill.t-speculative{color:var(--warn);border-color:var(--warn)}
.chip.lasting{color:var(--accent);border-color:var(--accent)}
.chip.later{color:var(--warn);border-color:var(--warn);border-style:dashed}
.echo{margin-top:12px;font-size:14px;color:var(--ink-2);border-left:3px solid var(--warn);padding-left:10px}
.panel.consq{border:1.5px solid var(--warn);background:var(--sheet)}
.counter{margin-top:16px;border-top:1px solid var(--rule);padding-top:10px;display:grid;gap:6px;font-size:14.5px;color:var(--ink-2)}
.why{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:13px}
.why li{display:grid;grid-template-columns:3.2em 1fr;gap:6px}
.why li span{font-family:var(--mono);font-weight:600;text-align:right}
.headings{display:grid;gap:2px}
details.explain.heading{border-top:0;padding-top:0}
details.explain.heading>summary{display:grid;grid-template-columns:16px auto 1fr auto;align-items:center;gap:8px;color:var(--ink);font-weight:400;padding:4px 0}
details.explain.heading>summary::before{display:none}
details.explain.heading .hd-ic svg{width:16px;height:16px;display:block}
details.explain.heading .hd-l{font-weight:700;font-size:14px}
details.explain.heading .hd-v{justify-self:end;font-size:13px}
details.explain.heading .hd-t{font-size:11.5px;color:var(--ink-3);min-width:9ch;text-align:right}
details.explain.heading .explain-body{padding-left:24px}
.kv.small{font-size:13px}
.kv.small dt small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.3}
.gloss{display:grid;gap:4px}
.gloss details.explain{padding-top:6px}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .title-grid,.plan-grid,.rgrid{grid-template-columns:minmax(0,1fr)}
  .forecast{position:static;order:-1}
}
@media (max-width:640px){
  .meters{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .meter{grid-template-columns:1fr;justify-items:stretch}
  .meter svg{grid-row:auto;width:16px;height:16px}
  .meter .lab span:first-child{display:none}
  .meter .lab{justify-content:flex-start}
  .months{margin-left:0;width:100%}
  .months i{flex:1;width:auto}
  .hud-sub{display:none}
  .bins{grid-template-columns:repeat(2,1fr)}
  .bins.five{grid-template-columns:repeat(3,1fr)}
  .statline{grid-template-columns:20px 70px 1fr 56px}
  .role{grid-template-columns:1fr auto}
  .role .acts{grid-column:1/-1;justify-content:flex-end}
  .card .text{font-size:16px}
  .hud{position:static}
  .hud-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding-block:8px 4px}
  .hud-top .month-label{grid-column:1;font-size:11px}
  .hud-top .icon-btn{grid-column:2;grid-row:1}
  .hud-top .months{grid-column:1/-1}
  .step:has(.seg){grid-template-columns:minmax(0,1fr)}
  .seg{width:100%}
  .seg button{flex:1 1 0;padding:.45em .4em;font-size:13px}
}
details.more-opts{display:grid;gap:14px}
details.more-opts>summary{cursor:pointer;font-weight:700;color:var(--accent);padding:10px 14px;border:1.5px dashed var(--rule);border-radius:12px;background:var(--sheet)}
details.more-opts[open]>summary{margin-bottom:14px}
.plan-head .btn[data-act="suggest"]{align-self:center}
/* ---------- warnings ---------- */
.warnbox{grid-column:1/-1;border:1.5px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--sheet));border-radius:12px;padding:10px 14px;font-size:15px}
/* ---------- weekly challenge and goals ---------- */
.weekly{display:grid;gap:8px;border:1.5px dashed var(--accent);border-radius:12px;padding:12px 14px;background:var(--accent-soft)}
.weekly p{font-size:14.5px}
.weekly .btn{justify-self:start}
.goal-line{margin-top:10px;font-weight:700}
/* ---------- leaderboard ---------- */
.board{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.board li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;border-bottom:1px dashed var(--rule)}
.board li:last-child{border-bottom:0}
.board li.me{background:var(--accent-soft);border-bottom-color:transparent}
.board .pos{font-family:var(--mono);font-weight:600;color:var(--ink-2);text-align:right}
.board li:nth-child(-n+3) .pos{color:var(--stamp)}
.board .who-b{min-width:0}
.board .who-b b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .who-b small{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.3}
.board .sc{font-family:var(--mono);font-weight:600;font-size:17px}
.board-form{display:grid;gap:8px;margin-bottom:4px}
.board-form label{font-weight:700;font-size:14px}
.board-form .name-row input{padding:.55em .7em}
.board-form .btn{justify-self:start}
.board-tabs{margin-top:6px}

/* ---------- touch and small screens ---------- */
button,.choice,.bin,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bin{user-select:none;-webkit-user-select:none}
.mgo{display:none}
details.rolebox>summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent);padding:4px 0}
@media (hover:none) and (pointer:coarse){
  .kbd,.kbd-only{display:none}
  .choice:hover:not([disabled]){transform:none;box-shadow:none;background:var(--sheet-2)}
  .choice:active:not([disabled]){background:var(--accent-soft)}
  .btn:hover{transform:none;box-shadow:none}
  .bin:hover{background:var(--sheet-2)}
  .bin:active{background:var(--accent-soft)}
}
@media (max-width:640px){
  .hud-name{white-space:normal;font-size:17px;line-height:1.2}
  .stage{padding-block:14px 32px}
  .card{padding:18px 16px 20px}
  .card h2{font-size:24px}
  .who{margin-bottom:10px}
  .mono-badge{width:42px;height:42px;font-size:15px}
  .ledger{gap:4px 12px;font-size:12px;padding-block:0 8px}
  .choice{padding:12px}
  .stepper button{width:44px;height:40px}
  .projects{grid-template-columns:1fr 1fr;gap:6px}
  .proj{padding:8px 10px}
  .proj b{font-size:13.5px}
  .proj small{font-size:12px}
  .role .acts button{padding:.5em .8em;font-size:13px}
  .plan-head{margin-bottom:12px}

  ['Global sum','The core payment for essential services: £130.07 per weighted patient a year in 2026/27, paid monthly. Practices that opt out of out-of-hours care lose 4.7%.',['S2','S3']],
  ['Weighted list (Carr-Hill)','Your list adjusted for need: age, sex, care-home residence (1.43x), new registration (1.46x for a year), rurality and staff costs. The global sum is paid on this, not on headcount.',['S3']],
  ['QOF','The Quality and Outcomes Framework. 582 points in 2026/27, each worth £227.95 for an average-sized practice, scaled for list size and disease prevalence.',['S3']],
  ['Aspiration payment','80% of last year\'s QOF value, paid monthly during the year. The balance for what you actually achieved is due by the end of the following June. Under-achieve and you pay some back.',['S3']],
  ['ARRS','The Additional Roles Reimbursement Scheme. Your PCN is reimbursed for pharmacists, physios, paramedics, care coordinators and others, up to a cap for each role. The practice still has to find the room and the supervision.',['S4']],
  ['PCN','Primary Care Network: a group of neighbouring practices working together under the Network Contract DES. Practices get £1.761 per weighted patient for taking part.',['S4']],
  ['ICB','Integrated Care Board: the NHS body that commissions and pays practices in your area, and issues remedial and breach notices.',[]],
  ['CQC','The Care Quality Commission, which inspects and rates practices on five questions: safe, effective, caring, responsive and well-led. About 5% of practices are rated Requires Improvement or Inadequate.',['S33']],
  ['LMC','Local Medical Committee: the local body that represents GPs and practices.',[]],
  ['Drawings','Money partners take each month on account of profit. Drawings aren\'t profits: at year end the accountant works out each share and settles the difference.',['S23']],
  ['Unlimited liability','Partners are jointly and severally liable for the practice\'s debts, including leases, loans and redundancy costs. Your house is on the line, in theory.',['S23','S43']],
  ['Last partner standing','If everyone else leaves, the remaining partner holds every lease, contract and debt alone. Deeds try to prevent it, for example with six months between leaving dates.',['S23','S43']],
  ['Partner pension','Partners pay their own member contribution (up to 12.5%) and the 14.38% employer share on NHS pensionable profit. It buys a defined-benefit pension.',['S22','S23']],
  ['Self Assessment','Partners pay income tax and Class 4 NI on 31 January and 31 July, with 50% payments on account. A new partner\'s first bill can land about 22 months after joining, all at once.',['S21','S23']],
  ['Employer NI','15% on each employee\'s pay above £5,000. Most employers get an Employment Allowance to offset it; practices doing mostly NHS work can\'t claim it.',['S19','S20']],
  ['Practice-level GP scheme','2026/27 money for extra GP sessions: £4.57 per patient, claimed at up to £78.41 an hour.',['S5']],
  ['Locum','A self-employed GP booked by the session. Typical in-hours rates are £85 to £105 an hour, and the practice adds 14.38% employer pension on NHS work.',['S28','S22']],
  ['Enhanced access','PCN evening and Saturday appointments: 60 minutes per 1,000 patients a week.',['S4']],
  ['Pharmacy First','Community pharmacies treat seven common conditions without a GP: sinusitis, sore throat, earache, infected insect bites, impetigo, shingles and uncomplicated UTIs in women.',[]],
  ['Online access rules','From 2026/27, practices can\'t cap online requests. Urgent needs are handled the same day and non-urgent ones by the end of the next working day. No "call back tomorrow".',['S1']],
  ['Safe working','BMA guidance puts a safe number of patient contacts at 25 per GP per day.',['S38']],
  ['Notional rent','For partner-owned buildings the NHS reimburses a rent set by a valuer, reviewed every three years.',['S30']],
  ['State-backed indemnity (CNSGP)','Covers NHS clinical negligence claims. It doesn\'t cover GMC cases, inquests or complaints, so GPs still pay a defence organisation.',['S40']],
  ['Significant event analysis','A structured, blame-free review of something that went wrong or nearly did, and what changes as a result.',[]],
  ['GP mythbusters','CQC\'s own series of over a hundred short guides saying what inspectors do and don\'t expect, written because practices kept doing expensive things nobody required.',['S45']],

function silLook(look) {

  let cut = '', dots = '', circ = '';

    const A = SIL_ACC[a]; if (!A) return;
    if (A.f) fill += A.f;
    if (A.c) { if (A.dash) dots += A.c; else cut += A.c; }
    if (A.cc) circ += `<circle cx="${A.cc[0]}" cy="${A.cc[1]}" r="${A.cc[2]}" fill="none" stroke="${SIL_TILE}" stroke-width="1.5"/>`;
  });

    <text x="60" y="610" font-family="Menlo, Consolas, monospace" font-size="24" fill="#C9CFDA">How long can you last? <tspan fill="#F2D449" font-weight="700">last-partner-standing.vercel.app</tspan></text>
  </svg>`;
}
function openShareImage() {
  const svg = shareSVG();
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = 1200; cv.height = 675;
    cv.getContext('2d').drawImage(img, 0, 0);
    cv.toBlob(blob => {
      if (!blob) { toast('Couldn\'t make the picture here.'); return; }
      const url = URL.createObjectURL(blob);
      const file = typeof File === 'function' ? new File([blob], 'last-partner-standing.png', { type: 'image/png' }) : null;
      const canShare = file && navigator.canShare && navigator.canShare({ files: [file] });
      openOverlay(`<h2>Your picture</h2><img class="share-img" src="${url}" alt="Dr ${esc(S.name)} at ${esc(prac().surgery)}"><div class="row-actions">${canShare ? '<button class="btn primary" data-act="shareimg-go">Share</button>' : ''}<a class="btn${canShare ? '' : ' primary'}" href="${url}" download="last-partner-standing.png">Save image</a><button class="btn ghost" data-act="close">Close</button></div>`);
      UI.shareFile = file;
    }, 'image/png');
  };
  img.onerror = () => toast('Couldn\'t make the picture here.');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

{id:'hartley_retire',arc:1,who:'hartley',title:'Six months\' notice',tag:'real',src:['S23','S43'],

     S.flags.hartleyGo=5; schedule('hartley_farewell',5-S.month); S.st.you=clamp(S.st.you-2); return {o:`"My wife has booked a cruise," he says. "Round the world. Leaves 1st October." It was never really a question.`}; }}

{id:'hartley_building',arc:1,who:'hartley',title:'About the building',cond:()=>isActive('hartley'),tag:'real',src:['S30','S44'],

{id:'okoye_email',arc:1,who:'okoye',title:'Just a joke',cond:()=>isActive('okoye'),tag:'real',src:['S36','S80','S81','S82'],
 info:'Australian GPs are mostly paid a share of what they bill Medicare and patients, usually 65% to 70%, and practices recruiting from overseas often guarantee an hourly rate for the first months. Job sites put the average Perth GP at about A$181 an hour (A$139 to A$237), or about A$225,000 a year. At A$1.88 to the pound in September 2026, A$200 an hour is about £106. In the national GP Worklife Survey, 37% of UK GPs reported a considerable or high intention to leave direct patient care within five years, and Australian recruiters advertise to them directly.',
 text:`Nadia forwards you a job advert. Perth, Western Australia: "A$200 an hour guaranteed for six months, then 70% of billings. Four-day week, 15-minute appointments, the clinic shuts at 5pm." That's about £106 an hour. "Ha! As if!" she writes. Later, passing her room, you catch a glimpse of her screen. An AI chatbot is halfway through "Your 12-month plan to move to Perth as a GP: registration, visas, schools".`,
 choices:[
  {t:'Offer to take over her QOF lead role',fx:{okoye:-18,you:-3,qof:2,mod:{id:'qoflead',label:'You took on the QOF lead role',months:6,hours:1.5}},o:`She hugs you. You now own the diabetes recall spreadsheet, which has 14 tabs and a macro nobody understands. It'll cost you an evening a week for a while.`},
  {t:'Laugh along: "Who even wants sunshine?"',fx:{okoye:12,you:1},o:`She laughs. The next time you pass her room, the chat window is minimised. Not closed.`},
  {t:'Suggest a month\'s sabbatical this summer',fx:{okoye:-26,team:1,mod:{id:'okoye_away',label:'Nadia on sabbatical',months:1,at:3,away:'okoye'}},o:`She takes July. She'll come back tanned, rested and slightly suspicious of how nice it felt. You'll be a partner short that month.`}
 ]},

{id:'okoye_leaving',arc:1,who:'okoye',title:'Nadia closes the door',cond:()=>isActive('okoye')&&S.okoye>=60,tag:'story',
 text:`"I've accepted the job in Perth. I'll work my notice until the end of January." She has already bought sun cream. Factor 50. The big bottle.`,
 choices:[
  {t:'Offer her fewer sessions and protected admin time',fx:{cash:-4},alt:{p:0.5,fx:{you:-3},o:`She is touched. She still goes. "It's not the money. It's that I haven't eaten lunch sitting down since 2021."`},
   run(){ if(!S._alt){ S.okoye=30; pt('okoye').clin=4; return {o:`She takes a long breath. "Four sessions. Protected admin time. And I get the room with the window." Deal. Nadia stays.`}; } schedule('okoye_goodbye',Math.max(0,9-S.month)); }},
  {t:'Wish her well and start planning',fx:{you:-2,team:-3},run(){ schedule('okoye_goodbye',Math.max(0,9-S.month)); },o:`You say the right things. Then you go to your room and look at the rota for February for a long time.`}
 ]},

{id:'okoye_staying',arc:1,who:'okoye',title:'Chat history',cond:()=>isActive('okoye')&&S.okoye<60,tag:'story',

 ]},

{id:'tom_partner',arc:1,who:'tom',title:'Tom has a question',cond:()=>S.staff.salaried>=1&&!S.flags.tomGone&&!isActive('tom'),tag:'real',src:['S11','S23'],

{id:'cqc_call',who:'bev',title:'The phone call',months:[4,5,6,7,8],w:()=>S.st.safety<45||S.rep<45?5:3,tag:'real',src:['S33'],

{id:'qof_yearend',arc:1,who:'bev',title:'Six weeks to go',tag:'rule',src:['S3','S13'],

{id:'contract_new',arc:1,who:'dept',title:'Next year\'s contract',tag:'speculative',
 info:'Contract changes for the following April are usually announced between February and March, leaving practices weeks to plan. The details of the 2027/28 contract in this card are invented.',
 text:()=>`The GP contract for ${2027 + (S.yr || 0)}/${28 + (S.yr || 0)} has been announced. It was trailed in a Sunday paper, confirmed on breakfast radio, and reached the practice on 28th March. It starts on 1st April. It's 94 pages long.`,

  {t:'Read all 94 pages tonight',fx:{you:-3,safety:2},o:`Page 61 contains a new requirement. Page 88 contains the funding for it, which is less than the cost of doing it.`},

 ]},

{id:'higgins_list',who:'higgins',title:'The list',tag:'story',
 text:`Mrs Higgins has brought a list. It's double-sided. Item one is her knee. Item five, in smaller writing, says "chest goes tight on the stairs, probably nothing". She has also brought you a tin of shortbread.`,

{id:'ai_printout',who:'patient',title:'Dr Chatbot',tag:'story',
 text:`A 34-year-old man brings a 12-page printout. "I put my symptoms into an AI. It says Addison's disease, lupus, or a rare parasite." He's been exhausted since his baby was born four months ago. He looks it.`,

{id:'antibiotics',who:'patient',title:'Just in case',months:[6,7,8,9,10],tag:'story',
 text:`A mum has taken the afternoon off work because her son's cold "went to his chest last winter and he ended up in hospital". Today his chest is clear and his temperature is 37.1. She's frightened, not demanding.`,

 ]},
