<title>Last Partner Standing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#E3EDE1;
  --paper-2:#D7E4D5;
  --sheet:#F8FBF6;
  --sheet-2:#EEF4EC;
  --ink:#15241C;
  --ink-2:#4A5E52;
  --ink-3:#6F8577;
  --rule:#BCCFBF;
  --accent:#1D6A4D;
  --accent-ink:#F4FAF6;
  --accent-soft:#CFE5D8;
  --stamp:#BF3A2C;
  --stamp-soft:#F6D9D4;
  --hilite:#F2D449;
  --good:#2C8656;
  --warn:#C27C12;
  --bad:#BF3A2C;
  --hatch:rgba(29,106,77,.055);
  --s1:#1D6A4D;--s2:#C27C12;--s3:#BF3A2C;--s4:#3563A8;
  --shadow:0 1px 0 rgba(21,36,28,.06),0 10px 28px -14px rgba(21,36,28,.35);
  --display:"Bricolage Grotesque","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0D1712;--paper-2:#122019;--sheet:#15241C;--sheet-2:#1B2D24;
    --ink:#DCE9E0;--ink-2:#A2B8AA;--ink-3:#7F968A;--rule:#2B4135;
    --accent:#5CBF90;--accent-ink:#08140E;--accent-soft:#1F3E30;
    --stamp:#F07C6E;--stamp-soft:#3E1F1B;--hilite:#E6C84A;
    --good:#5CBF90;--warn:#E3A43E;--bad:#F07C6E;--hatch:rgba(92,191,144,.045);--s1:#5CBF90;--s2:#E3A43E;--s3:#F07C6E;--s4:#86AEE8;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0D1712;--paper-2:#122019;--sheet:#15241C;--sheet-2:#1B2D24;
  --ink:#DCE9E0;--ink-2:#A2B8AA;--ink-3:#7F968A;--rule:#2B4135;
  --accent:#5CBF90;--accent-ink:#08140E;--accent-soft:#1F3E30;
  --stamp:#F07C6E;--stamp-soft:#3E1F1B;--hilite:#E6C84A;
  --good:#5CBF90;--warn:#E3A43E;--bad:#F07C6E;--hatch:rgba(92,191,144,.045);--s1:#5CBF90;--s2:#E3A43E;--s3:#F07C6E;--s4:#86AEE8;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 9px);
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hilite);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.08;text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
#app{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-inline:16px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:1.5px solid var(--ink);
  background:var(--sheet);border-radius:999px;padding:.62em 1.2em;font-weight:700;line-height:1.1;
  transition:transform .12s ease,background .12s ease,box-shadow .12s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{box-shadow:0 3px 0 var(--ink)}
.btn.ghost{border-color:var(--rule);background:transparent}
.btn.small{padding:.4em .85em;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 .35em;opacity:.7}

/* ---------- title screen ---------- */
.title-screen{flex:1;padding-block:clamp(24px,6vh,64px) 48px}
.title-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,4vw,56px);align-items:start}
.logo{font-size:clamp(46px,8.2vw,104px);font-weight:800;letter-spacing:-.035em;line-height:.88;font-variation-settings:"opsz" 96}
.logo .rx{display:inline-block;font-family:var(--mono);font-weight:600;font-size:.3em;letter-spacing:0;vertical-align:.95em;color:var(--stamp);border:2px solid var(--stamp);border-radius:6px;padding:.05em .3em;transform:rotate(-8deg);margin-left:.15em}
.logo .under{background:linear-gradient(transparent 62%,var(--hilite) 62% 90%,transparent 90%);padding-inline:.04em}
.tagline{font-size:clamp(17px,2vw,20px);max-width:34ch;margin-top:22px;color:var(--ink-2)}
.memo{margin-top:26px;max-width:52ch;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);font-size:15px}
.memo ul{margin:.4em 0 0;padding-left:1.1em;display:grid;gap:.25em}
.setup{background:var(--sheet);border:1.5px solid var(--ink);border-radius:14px;padding:22px;box-shadow:var(--shadow);display:grid;gap:18px}
.setup label.field{display:grid;gap:6px;font-weight:700}
.name-row{display:flex;align-items:center;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet-2);overflow:hidden}
.name-row span{padding:.55em .7em;font-family:var(--mono);color:var(--ink-2);border-right:1px solid var(--rule)}
.name-row input{flex:1;min-width:0;border:0;background:transparent;padding:.55em .7em;outline:none}
.pcards{display:grid;gap:10px}
.pcard{text-align:left;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.pcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.pcard b{font-family:var(--display);font-size:18px}
.pcard .diff{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;align-self:center}
.pcard .d{grid-column:1/-1;font-size:14px;color:var(--ink-2)}
.pcard .facts{grid-column:1/-1;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.setup-actions{display:flex;flex-wrap:wrap;gap:10px}
.best{font-size:14px;color:var(--ink-2)}
.best li{font-family:var(--mono);font-size:12.5px}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.hud-top{display:flex;align-items:center;gap:14px;padding-block:10px 6px;flex-wrap:wrap}
.hud-name{font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap}
.hud-sub{font-size:13px;color:var(--ink-2)}
.months{display:flex;gap:3px;margin-left:auto;align-items:flex-end}
.months i{display:block;width:clamp(14px,2.4vw,26px);height:6px;border-radius:2px;background:var(--rule)}
.months i.done{background:var(--accent)}
.months i.now{background:var(--hilite);height:10px}
.month-label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.icon-btn{border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;width:34px;height:34px;display:grid;place-items:center}
.meters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding-block:4px 10px}
.meter{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;position:relative;min-width:0}
.meter svg{width:20px;height:20px;grid-row:span 2}
.meter .lab{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:6px;min-width:0}
.meter .lab span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .val{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--paper-2);border:1px solid var(--rule);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1),background .3s}
.meter.low .bar b{background:var(--warn)}
.meter.crit .bar b{background:var(--bad)}
.meter.crit .val{color:var(--bad)}
.meter .hint{position:absolute;top:-7px;left:6px;width:10px;height:10px;border-radius:50%;background:var(--ink);opacity:0;transform:scale(.3);transition:.15s}
.meter .hint.on{opacity:1;transform:scale(1)}
.meter .hint.big{width:14px;height:14px;top:-9px;left:4px}
.meter.pulse-up .bar{box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 45%,transparent)}
.meter.pulse-down .bar{box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 45%,transparent)}
.ledger{display:flex;flex-wrap:wrap;gap:6px 18px;padding-block:0 10px;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.ledger b{color:var(--ink);font-weight:600}
.ledger .warnv{color:var(--warn)}
.ledger .badv{color:var(--bad)}

/* ---------- stage ---------- */
.stage{flex:1;padding-block:22px 48px}
.card{
  position:relative;max-width:640px;margin:0 auto;background:var(--sheet);border:1.5px solid var(--ink);border-radius:14px;
  box-shadow:var(--shadow);padding:22px clamp(18px,3vw,30px) 24px;animation:deal .38s cubic-bezier(.2,.8,.2,1)
}
.card::before{content:"";position:absolute;inset:8px auto 8px 8px;width:2px;background:repeating-linear-gradient(to bottom,var(--stamp) 0 6px,transparent 6px 10px);opacity:.35;border-radius:2px}
@keyframes deal{from{transform:translateY(14px) rotate(-.6deg);opacity:0}to{transform:none;opacity:1}}
.who{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mono-badge{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;color:#fff;letter-spacing:.02em;border:2px solid var(--ink)}
.who b{display:block;font-size:16px;line-height:1.2}
.who small{color:var(--ink-2);font-size:13px}
.card .stampno{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--stamp);border:1.5px solid var(--stamp);border-radius:5px;padding:2px 7px;transform:rotate(3deg);white-space:nowrap}
.card h2{font-size:clamp(24px,3.4vw,32px);font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.card .text{font-size:17px;max-width:60ch}
.card .text p+p{margin-top:.6em}
.choices{display:grid;gap:10px;margin-top:20px}
.choice{
  text-align:left;border:1.5px solid var(--ink);background:var(--sheet-2);border-radius:10px;padding:12px 14px;display:grid;gap:6px;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease
}
.choice:hover:not([disabled]),.choice:focus-visible{transform:translateX(3px);box-shadow:-4px 0 0 var(--accent);background:var(--sheet)}
.choice[disabled]{opacity:.5;cursor:not-allowed}
.choice .t{font-weight:700;font-size:16px}
.choice .why{font-size:13px;color:var(--stamp)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);border:1px solid var(--rule);border-radius:99px;padding:1px 8px 1px 5px;background:var(--sheet)}
.chip svg{width:14px;height:14px}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-2)}
.chip .dot.big{width:10px;height:10px}
.chip.risk{border-style:dashed;color:var(--stamp);border-color:var(--stamp)}
.outcome .text{font-size:17px}
.deltas{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.delta{font-family:var(--mono);font-size:13px;font-weight:600;border-radius:6px;padding:3px 9px;border:1.5px solid}
.delta.up{color:var(--good);border-color:var(--good)}
.delta.down{color:var(--bad);border-color:var(--bad)}
.delta.neutral{color:var(--ink-2);border-color:var(--rule)}
.card-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.card-foot .muted{margin-right:auto;font-size:13px}

/* ---------- planning ---------- */
.plan-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:18px}
.plan-head h1{font-size:clamp(30px,4.6vw,48px);font-weight:800;letter-spacing:-.03em}
.brief{flex:1 1 320px;font-size:15px;color:var(--ink-2);border-left:3px solid var(--hilite);padding-left:12px}
.plan-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:18px;align-items:start}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;display:grid;gap:12px}
.panel h3{font-size:19px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel h3 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--ink-2)}
.col{display:grid;gap:14px}
.steps{display:grid;gap:8px}
.step{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--rule)}
.step:last-child{border-bottom:0}
.step .l b{display:block}
.step .l small{color:var(--ink-2);font-size:13px}
.stepper{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--sheet-2)}
.stepper button{width:34px;height:32px;border:0;background:transparent;font-weight:700;font-size:18px;line-height:1}
.stepper button:hover:not([disabled]){background:var(--accent-soft)}
.stepper button[disabled]{opacity:.3;cursor:not-allowed}
.stepper output{min-width:30px;text-align:center;font-family:var(--mono);font-weight:600}
.sessbar{display:flex;gap:3px;flex-wrap:wrap}
.sessbar i{width:22px;height:14px;border-radius:3px;border:1px solid var(--ink-2)}
.sessbar i.c{background:var(--accent)}
.sessbar i.a{background:var(--hilite)}
.sessbar i.m{background:var(--stamp)}
.sessbar i.over{outline:2px solid var(--bad);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;background:var(--sheet-2);padding:.4em .9em;font-size:14px;font-weight:700}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.proj{text-align:left;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px;display:grid;gap:3px;align-content:start}
.proj b{font-size:14.5px}
.proj small{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.proj[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.proj[disabled]{opacity:.45;cursor:not-allowed}
.roles{display:grid;gap:0}
.role{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--rule)}
.role:last-child{border-bottom:0}
.role .l b{font-size:14.5px}
.role .l small{display:block;font-size:12px;color:var(--ink-2);line-height:1.3}
.role .n{font-family:var(--mono);font-weight:600;min-width:2ch;text-align:right}
.role .acts{display:flex;gap:5px}
.role .acts button{font-size:12.5px;padding:.3em .65em;border-radius:99px;border:1.5px solid var(--ink);background:var(--sheet-2);font-weight:700}
.role .acts button[disabled]{opacity:.35;cursor:not-allowed}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 5px;vertical-align:1px;margin-left:4px}
.tag.arrs{background:var(--accent-soft);color:var(--accent)}
.tag.vac{background:var(--hilite);color:#2b2300}
.forecast{position:sticky;top:150px}
.fc-row{display:grid;gap:5px}
.fc-row .top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.fc-row .top b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gauge{position:relative;height:12px;background:var(--paper-2);border-radius:99px;border:1px solid var(--rule);overflow:hidden}
.gauge b{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px;transition:width .3s}
.gauge i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.gauge.warn b{background:var(--warn)}
.gauge.bad b{background:var(--bad)}
.fc-note{font-size:12.5px;color:var(--ink-2)}
.good-t{color:var(--good)}.warn-t{color:var(--warn)}.bad-t{color:var(--bad)}
.plan-go{display:flex;justify-content:flex-end;margin-top:16px}

/* ---------- report ---------- */
.report{max-width:860px;margin:0 auto;display:grid;gap:16px}
.clip{background:var(--sheet);border:1px solid var(--rule);padding:16px 20px 18px;border-radius:4px;box-shadow:var(--shadow);transform:rotate(-.4deg)}
.clip .masthead{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-bottom:3px double var(--ink);padding-bottom:6px;display:flex;justify-content:space-between;gap:10px}
.clip h2{font-size:clamp(24px,3.6vw,36px);font-weight:800;letter-spacing:-.02em;margin-top:10px}
.clip p{margin-top:6px;color:var(--ink-2);font-style:italic}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14.5px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.kv .sum{border-top:1.5px solid var(--ink);padding-top:4px;font-weight:700;color:var(--ink)}
.notes{margin:0;padding-left:1.1em;display:grid;gap:5px;font-size:14.5px}
.statlines{display:grid;gap:8px}
.statline{display:grid;grid-template-columns:22px 90px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.statline svg{width:18px;height:18px}
.statline .d{font-family:var(--mono);text-align:right}

/* ---------- mini games ---------- */
.mini{max-width:720px;margin:0 auto;display:grid;gap:14px}
.mini-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mini-top h2{font-size:28px;font-weight:800}
.mini-score{margin-left:auto;font-family:var(--mono);font-size:14px;display:flex;gap:14px}
.timer{height:10px;border-radius:99px;background:var(--paper-2);border:1px solid var(--rule);overflow:hidden}
.timer b{display:block;height:100%;background:var(--accent);transition:width .1s linear}
.timer.hurry b{background:var(--bad)}
.doc{background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;padding:18px 20px;min-height:170px;box-shadow:var(--shadow);animation:slide .22s ease-out;position:relative}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.doc .kind{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:10px}
.doc .body{font-family:var(--mono);font-size:15.5px;line-height:1.55}
.doc.sms{border-radius:18px 18px 18px 4px}
.doc .fb{position:absolute;right:12px;bottom:10px;font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px}
.doc .fb.ok{background:var(--accent-soft);color:var(--good)}
.doc .fb.no{background:var(--stamp-soft);color:var(--bad)}

/* ===================== EVENTS 1: story arcs =====================
 Event: {id, who, title, text, cond(), months[], w, arc (scheduled only), rep (repeatable), max, kind:'mini', game}
 Choice: {t, fx:{...}|()=>{...}, o, alt:{p,fx,o}, need(), why, run()=>({o,html}|void)}
 fx keys: patients team you safety cash qof inbox list demand admin rooms okoye staff:{} flags:{} sched:[[id,inMonths]] mod:{}
*/
const EVENTS = [];

EVENTS.push(
{id:'welcome',arc:1,who:'bev',title:'Welcome to the partnership',
 text:`Your name is on the contract now. Also the lease, the bank mandate and the overdraft. "Partners have unlimited liability," Bev says, handing you a lanyard. "Right. Where do you want to start?"`,
 choices:[
  {t:'Meet every member of staff, one by one',fx:{team:6,you:-3},o:`Twenty-three conversations. You learn who makes the tea, who does the rota, and that nobody has fixed the back door since 2019.`},
  {t:'Go through the practice accounts line by line',fx:{cash:4,you:-3},o:`You find a direct debit for a photocopier the practice has not owned since 2017. Cancelled. You feel like a partner already.`},
  {t:'Clear the inbox so you start clean',fx:{inbox:-120,you:-4,safety:2},o:`You file until 9pm. A letter from 2023 asks you to "please arrange" something. You decide it has arranged itself.`}
 ]},

{id:'hartley_retire',arc:1,who:'hartley',title:'Wonderful news',
 text:`"I'm retiring at the end of September! Thirty-four years. The golf club has been very patient." Alan beams. He does 6 clinical sessions a week, and nobody else knows how the dispensary stock system works.`,
 choices:[
  {t:'"Congratulations, Alan. We\'ll manage."',fx:{team:2,flags:{hartleyGo:5},sched:[['hartley_building',2],['hartley_farewell',5]]},o:`He shakes your hand for slightly too long. "You'll be fine. It practically runs itself."`},
  {t:'"Would you retire and return? Four sessions, no admin?"',fx:{sched:[['hartley_building',2]]},
   run(){ if(chance(0.55)){ pt('hartley').clin=4; S.flags.hartleyGo=11; schedule('hartley_farewell_late',11-S.month); return {o:`He thinks about it over a Garibaldi. "Four sessions. No home visits. And I keep my parking space." Deal. He stays until March.`}; }
     S.flags.hartleyGo=5; schedule('hartley_farewell',5-S.month); S.st.you=clamp(S.st.you-2); return {o:`"My wife has booked a cruise," he says. "Round the world. Leaves 1st October." It was never really a question.`}; }}
 ]},

{id:'hartley_building',arc:1,who:'hartley',title:'About the building',cond:()=>pt('hartley').status==='active',
 text:`"One small thing. I own a third of the building. My share is valued at £210,000, and I'd like it before I go." Premises ownership: the gift that keeps on giving.`,
 choices:[
  {t:'Take out a partnership loan and buy him out',fx:{you:-4,flags:{loan:1}},run(){S.loan=(S.loan||0)+1.6;},o:`The bank is delighted. You now own a larger share of a building with a flat roof. Repayments: £1.6k a month, for twenty years.`},
  {t:'Ask Nadia to take on half the debt with you',need:()=>isActive('okoye'),why:'Nadia is no longer a partner',fx:{okoye:22,you:-2},run(){S.loan=(S.loan||0)+0.8;},o:`Nadia signs. She does not make eye contact. She makes a phone call in the car park that lasts forty minutes.`},
  {t:'Sell the building to an investor and lease it back',fx:{cash:22,team:-2,flags:{soldBuilding:1}},run(){S.premX=(S.premX||0)+2.4;},o:`Alan gets his money and the practice gets a cash injection. The new landlord, a pension fund in Guernsey, sends a lease with a five-yearly upward-only rent review.`}
 ]},

{id:'hartley_farewell',arc:1,who:'bev',title:'Alan\'s leaving do',cond:()=>pt('hartley').status==='active',
 text:`It's Alan's last week. The collection envelope contains £43.20 and a button. He has asked, loudly, whether there will be "a speech and a proper send-off".`,
 choices:[
  {t:'Book the function room at the Fox & Hounds (£1,500)',fx:{team:7,cash:-1.5},o:`He cries during his speech. So does Maureen. The karaoke goes on until 1am. It is the best night the practice has had in years.`},
  {t:'Cake and a card in the staff room',fx:{team:2},o:`A Colin the Caterpillar and a card that says "Good luck in your new job". Alan is gracious about it.`}
 ],
 after(){ partnerLeaves('hartley'); }},

{id:'hartley_farewell_late',arc:1,who:'hartley',title:'Alan hangs up the stethoscope',cond:()=>pt('hartley').status==='active',
 text:`Alan did his four sessions right to the end. Thirty-five years. He leaves you his desk, a tin of travel sweets, and a 1994 BNF "for sentimental value".`,
 choices:[
  {t:'Organise a proper send-off (£1,500)',fx:{team:6,cash:-1.5,you:2},o:`He tells the story about the home visit and the goat. Everyone has heard it. Everyone laughs anyway.`},
  {t:'A handshake and a heartfelt card',fx:{team:2,you:1},o:`"You'll be fine," he says. "Better than fine." You almost believe him.`}
 ],
 after(){ partnerLeaves('hartley'); }},

{id:'okoye_email',arc:1,who:'okoye',title:'Just a joke',cond:()=>isActive('okoye'),
 text:`Nadia forwards you a job advert. Perth, Western Australia. AUD 420,000, four-day week, 15-minute appointments. "Ha! As if!" she writes. You notice she has printed it out and laminated it.`,
 choices:[
  {t:'Offer to take over her QOF lead role',fx:{okoye:-18,you:-3,qof:2},o:`She hugs you. You now own the diabetes recall spreadsheet, which has 14 tabs and a macro nobody understands.`},
  {t:'Laugh along: "Who even wants sunshine?"',fx:{okoye:12,you:1},o:`She laughs. The laminated advert goes back in her bag. Carefully.`},
  {t:'Suggest a month\'s sabbatical this summer',fx:{okoye:-26,team:1,mod:{id:'okoye_away',label:'Nadia on sabbatical',months:1,at:3,away:'okoye'}},o:`She takes July. She comes back tanned, rested and slightly suspicious of how nice it felt.`}
 ]},

{id:'okoye_leaving',arc:1,who:'okoye',title:'Nadia closes the door',cond:()=>isActive('okoye')&&S.okoye>=60,
 text:`"I've accepted the job in Perth. I'll work my notice until the end of January." She has already bought sun cream. Factor 50. The big bottle.`,
 choices:[
  {t:'Offer her fewer sessions and a bigger profit share',fx:{cash:-4},alt:{p:0.5,fx:{you:-3},o:`She is touched. She still goes. "It's not the money. It's that I haven't eaten lunch sitting down since 2021."`},
   run(){ if(!S._alt){ S.okoye=30; pt('okoye').clin=4; return {o:`She takes a long breath. "Four sessions. Protected admin time. And I get the room with the window." Deal. Nadia stays.`}; } schedule('okoye_goodbye',Math.max(0,9-S.month)); }},
  {t:'Wish her well and start planning',fx:{you:-2,team:-3},run(){ schedule('okoye_goodbye',Math.max(0,9-S.month)); },o:`You say the right things. Then you go to your room and look at the rota for February for a long time.`}
 ]},

{id:'okoye_staying',arc:1,who:'okoye',title:'The laminated advert',cond:()=>isActive('okoye')&&S.okoye<60,
 text:`Nadia drops something in the confidential waste. It's the laminated Perth advert. "This place is mad," she says, "but it's our mad."`,
 choices:[
  {t:'Hug her (awkwardly)',fx:{team:3,you:3},o:`It is exactly as awkward as expected. Kayleigh sees and tells everyone. Morale improves.`},
  {t:'Buy her a proper coffee',fx:{you:2,team:1},o:`Flat white, oat milk, from the good place. Twenty minutes of actual conversation. Neither of you mentions work.`}
 ]},

{id:'okoye_goodbye',arc:1,who:'okoye',title:'G\'day from the future',cond:()=>isActive('okoye'),
 text:`Nadia's last day. She leaves a card on your desk: "Sorry, not sorry. Come and visit. The sessions here are FOUR HOURS." Her patients have been asking who their new doctor is.`,
 choices:[
  {t:'Send her off with a proper lunch',fx:{team:3,cash:-0.5},o:`She cries in the car park, then drives to the airport. The WhatsApp photos arrive a week later. There is a beach.`},
  {t:'Get straight back to work',fx:{you:-2},o:`You split her patients across the remaining lists. Nobody gets lunch.`}
 ],
 after(){ partnerLeaves('okoye'); }},

{id:'tom_partner',arc:1,who:'tom',title:'Tom has a question',cond:()=>S.staff.salaried>=1&&!S.flags.tomGone&&!isActive('tom'),
 text:`Tom, your salaried GP, catches you by the kettle. "I've been thinking. I'd like to become a partner." He has been reading the accounts. He has questions about the overdraft.`,
 choices:[
  {t:'"Yes. Welcome to the partnership."',fx:{team:4,you:2,cash:10},run(){ S.staff.salaried--; S.partners.tom.status='active'; },o:`Tom buys in with £10k of capital and a bottle of prosecco. He is a partner now. He will take a share of the profits, and of the liability.`},
  {t:'"Not this year. Let\'s review it in twelve months."',fx:{team:-2},alt:{p:0.5,o:`Tom nods. Six weeks later he hands in his notice. He's joining a practice across town as a partner.`,fx:{team:-3,sched:[['tom_leaves',1]]}},o:`Tom nods slowly. "Fair enough." He stays, but he has stopped volunteering for things.`},
  {t:'Offer him a pay rise to stay salaried',fx:{team:1},run(){ S.tomRaise=0.8; },o:`An extra £800 a month. He takes it. "No liability, no drawings, no stress," he says. You are briefly jealous of your own employee.`}
 ]},

{id:'tom_leaves',arc:1,who:'tom',title:'Tom\'s last day',cond:()=>S.staff.salaried>=1&&!S.flags.tomGone&&!isActive('tom'),
 text:`Tom's last day. He's off to be a partner at the practice on the other side of the ring road. He leaves 40 unfiled results and a thank-you card.`,
 choices:[{t:'Wish him well',fx:{inbox:40,team:-2},run(){ S.staff.salaried--; S.flags.tomGone=1; },o:`You now have one fewer GP and a new appreciation for how much Tom actually did.`}]},

{id:'partner_advert',who:'bev',title:'Advertise for a partner?',months:[4,5,6,7,8,9],cond:()=>activeOthers()<=1,
 text:`"We're thin on partners," Bev says. "Do we advertise? The last partnership advert in {place} got no applicants. Well, one. He wanted to work Tuesdays only and bring his dog."`,
 choices:[
  {t:'Advertise nationally (£1,500)',fx:{cash:-1.5},alt:{p:0.45,o:`Six weeks. No applicants. The advert gets shared on a GP forum with the caption "LOL, unlimited liability".`,fx:{you:-2}},run(){ if(!S._alt) schedule('partner_applicant',2); },o:`The advert goes out. You check the inbox every morning like it's exam results day.`},
  {t:'Don\'t bother. Salaried GPs are the future.',fx:{you:1},o:`You tell yourself this is a strategic decision. It is mostly a financial one.`}
 ]},

{id:'partner_applicant',arc:1,who:'bev',title:'An actual applicant',cond:()=>activeOthers()<=2,
 text:`Dr Priya Nair, eight years qualified, currently salaried in the city, wants to become a partner. Her conditions: six sessions, no premises liability, and she never, ever does the Christmas Eve duty.`,
 choices:[
  {t:'Welcome her aboard',fx:{team:5,you:4,cash:12},run(){ S.partners.priya.status='active'; },o:`Priya starts next month with £12k of capital and a label maker. The partnership has hope again.`},
  {t:'Decline. The terms are too much.',fx:{you:-1},o:`She joins the practice across the ring road. You see her in Tesco. She looks well rested.`}
 ]},

{id:'apex_offer',who:'apex',title:'An exciting opportunity',months:[6,7,8,9],w:1.4,
 text:`A man in a gilet takes you for lunch. Apex Primary Care Ltd would like to "acquire the contract and unlock synergies". They'll pay your share, and you can stay on as a salaried "Clinical Lead". Your lunch is £38. He does not stay for pudding.`,
 choices:[
  {t:'Sell. Let someone else hold the liability.',run(){ S.soldOut=1; return {o:`You sign. The papers take three minutes. The phone system changes to a national call centre the following Monday.`}; }},
  {t:'Politely decline',fx:{you:1},o:`"Totally understand," he says, already typing an email to the practice down the road.`},
  {t:'Tell him where to put his synergies',fx:{team:4,you:3,patients:1},o:`Kayleigh tells the whole building. Morale is briefly excellent.`}
 ]},

{id:'cqc_call',who:'bev',title:'The phone call',months:[4,5,6,7,8],w:3,
 text:`Bev walks in and closes the door. She never closes the door. "CQC just rang. Inspection in two weeks." Somewhere, a fire safety policy last reviewed in 2021 begins to sweat.`,
 choices:[
  {t:'All hands: weekend prep marathon',fx:{safety:9,team:-6,you:-5},o:`Policies updated, fridges logged, the emergency drugs box finally has in-date adrenaline. Everyone is exhausted.`},
  {t:'Hire a CQC consultant (£5,000)',fx:{safety:10,cash:-5,team:-1},o:`Gavin arrives with 400 pages of templates and a lanyard that says "Compliance Is Care".`},
  {t:'"We are always inspection-ready."',fx:{you:1},o:`You say this with confidence. Bev writes something in her notebook and underlines it twice.`}
 ],
 after(){ schedule('cqc_visit',1); }},

{id:'cqc_visit',arc:1,who:'cqc',title:'Inspection day',
 text:`Patricia Sharpe arrives at 8:29 with a clipboard, a lanyard and an expression you cannot read. She would like to see the fridge logs, the significant event log, the complaints file, and "just how things really are".`,
 choices:[{t:'Show her how things really are',run(){ return runCQC(); }}]},

{id:'qof_yearend',arc:1,who:'bev',title:'Six weeks to go',
 text:`"QOF year end is 31st March. We're sitting at {qof}%." Bev has printed the list of patients still missing their reviews. It is the thickness of a paperback.`,
 choices:[
  {t:'Saturday recall clinics for the rest of the year',fx:{qof:9,you:-5,team:-4,cash:-1.5},o:`Four Saturdays of spirometry, foot checks and blood pressures. Maureen does her last one wearing a tiara for reasons nobody explains.`},
  {t:'Text blast plus a push on exception reporting where it\'s justified',fx:{qof:4,safety:-1},o:`The care-coordination team sends 1,100 texts. Twelve people reply "STOP". One replies with a photo of their cat.`},
  {t:'Accept fate',fx:{you:2},o:`You decide QOF is a construct. The accountant will tell you in June exactly how expensive this construct is.`}
 ]},

{id:'contract_new',arc:1,who:'dept',title:'Next year\'s contract',
 text:`The GP contract for next year has been announced. It was trailed in a Sunday newspaper, confirmed on breakfast radio, and reached the practice on 28th March. It starts on 1st April. It is 94 pages long.`,
 choices:[
  {t:'Read all 94 pages tonight',fx:{you:-3,safety:2},o:`Page 61 contains a new requirement. Page 88 contains the funding for it, which is less than the cost of doing it.`},
  {t:'Wait for the LMC summary',fx:{you:2},o:`The LMC summary arrives two days later. It is two pages long and mostly swearing, professionally phrased.`}
 ]},

{id:'mini_docman',kind:'mini',game:'docman',rep:1,max:3,who:'bev',title:'Docman Dash',w:1.1,
 text:`The document inbox has {inbox} items in it. Bev asks if you want to blitz some yourself between patients. Letters, results and requests: file it, action it, flag it urgent, or bounce it back to where it belongs.`,
 choices:[
  {t:'Grab a coffee and blitz it (45-second game)',play:1},
  {t:'Delegate: pay the admin team overtime to pre-sort',fx:{inbox:-60,cash:-0.6},o:`They sort 60 items. One urgent potassium sits in "routine" until Thursday. Nobody died. This time.`}
 ]},

{id:'mini_triage',kind:'mini',game:'triage',rep:1,max:3,who:'kayleigh',title:'The 8am Rush',w:1.1,
 text:`08:00. The phone queue says 63. The online consultation tool has 41 new requests. Kayleigh looks at you with the eyes of a soldier in a war film. "Can you help triage?"`,
 choices:[
  {t:'Take the hot seat (45-second game)',play:1},
  {t:'Let reception work through the template',fx:{patients:-1,demand:0.5},o:`The template does its best. Three sore throats get GP appointments and a sprained ankle gets a call-back from the paramedic.`}
 ]}
);
/* ===================== EVENTS 2: patients, team, you ===================== */
EVENTS.push(
{id:'higgins_list',who:'higgins',title:'The list',
 text:`Mrs Higgins has brought a list. It is double-sided. Item one is her knee. Item seven is "the thing with my eye, but only on Tuesdays". She has also brought you a tin of shortbread.`,
 choices:[
  {t:'Work through all seven items',fx:{patients:5,you:-4},o:`Forty minutes later you are 35 minutes behind, but you now know everything about her eye. The shortbread is excellent.`},
  {t:'"Let\'s do the two most important today."',fx:{patients:1,you:-1},o:`She chooses the knee and, unexpectedly, item five: "chest feels tight on the stairs". Good call. You arrange an ECG.`},
  {t:'"One problem per appointment, I\'m afraid."',fx:{patients:-4,you:1},o:`She rebooks for items two to seven. As six separate appointments. On six separate days.`}
 ]},

{id:'ai_printout',who:'patient',title:'Dr Chatbot',
 text:`A 34-year-old man arrives with a 12-page printout. "I put my symptoms into an AI. It says Addison's disease, lupus, or a rare parasite from Peru." He has been tired since his baby was born four months ago.`,
 choices:[
  {t:'Go through the printout together, properly',fx:{patients:4,you:-3},o:`It takes 25 minutes. He leaves reassured, with bloods booked and a sleep plan. He asks if he can give the AI your feedback.`},
  {t:'Order every test on the list to settle it',fx:{patients:3,inbox:35,cash:-0.3},o:`Seventeen blood tests. Sixteen are normal. The seventeenth is borderline and generates four more appointments.`},
  {t:'"The internet is not a doctor."',fx:{patients:-4,you:1},o:`He posts a one-star review: "Dismissive. The AI had better bedside manner." It is hard to argue.`}
 ]},

{id:'antibiotics',who:'patient',title:'I know my body',months:[6,7,8,9,10],
 text:`"I've had a cold for four days. I always need antibiotics for it. I know my body." Her chest is clear. Her temperature is 37.1. She has taken the afternoon off work for this.`,
 choices:[
  {t:'Explain viral infections and safety-net',fx:{patients:-2,safety:2},o:`She sighs heavily and leaves with a leaflet. She is better by Sunday, which she puts down to the honey.`},
  {t:'Give a delayed prescription',fx:{patients:1,safety:1},o:`"Only if it's not better in a week." She collects it the same afternoon. You are almost certain.`},
  {t:'Just give her the amoxicillin',fx:{patients:3,safety:-3},o:`She is delighted. Your antibiotic prescribing data is not. The ICB medicines team will be in touch.`}
 ]},

{id:'backdated_note',who:'patient',title:'Just a little note',
 text:`A patient wants a fit note backdated three weeks to cover a cancelled holiday for an insurance claim. "It was stress. From the holiday. That I didn't go on."`,
 choices:[
  {t:'Decline. Offer a private letter describing today\'s consultation.',fx:{patients:-2,safety:2},o:`He grumbles about "red tape" and pays the £35 fee. The letter says exactly what happened, which is not what he wanted.`},
  {t:'Introduce a practice-wide private letter fee list',fx:{patients:-3,team:2},run(){ addMod({id:'fees',label:'Private fee income',months:99,fx:{cash:0.4}}); },o:`Reception gets a laminated fee list. Requests for "a quick letter" drop by half. Income from the rest: about £400 a month.`},
  {t:'Write it. It\'s easier.',fx:{patients:2,safety:-4},o:`You sign it. Then you lie awake thinking about the phrase "fitness to practise".`}
 ]},

{id:'facebook',who:'paper',title:'The Facebook group',
 text:`The {place} Community Chat group has a post: "ANYONE ELSE UNABLE TO GET THROUGH TO {surgery}??? 🤬🤬". It has 312 comments. Someone has posted a photo of your car, parked.`,
 choices:[
  {t:'Post a calm explainer about how to get help',fx:{patients:3,you:-2},o:`"Thanks for explaining!!" says one comment. "Typical excuses" says another. Net positive, mostly.`},
  {t:'Ignore it. Never read the comments.',fx:{patients:-2,you:1},o:`You don't read the comments. Bev does, and summarises them for you at length.`},
  {t:'Invite the angriest poster to join the patient group',fx:{patients:4,you:-1},alt:{p:0.35,fx:{patients:-3,you:-3},o:`She comes. She brings the other 311 commenters' concerns in a ring binder.`},o:`She comes, listens, and becomes your most ferocious defender online. Nobody saw that coming.`}
 ]},

{id:'pratt_complaint',who:'pratt',title:'A formal complaint',
 text:`Mr Pratt has written. Four pages, single spaced, with footnotes. His routine appointment was offered in "an unacceptable" three days. He has copied in the ICB, the Ombudsman and, for reasons unclear, the Archbishop of Canterbury.`,
 choices:[
  {t:'Invite him in to talk it through',fx:{you:-3,patients:2},alt:{p:0.3,fx:{you:-5},o:`The meeting lasts 90 minutes. He brings a Dictaphone. He is satisfied in the sense that he now has more material.`},o:`He talks for an hour. At the end he shakes your hand: "First time anyone's listened." He sends Christmas cards now.`},
  {t:'Send the standard written response',fx:{patients:-1,safety:1},o:`Your response is measured and correct. His reply is longer.`},
  {t:'Suggest he might be happier registered elsewhere',fx:{you:2},alt:{p:0.6,fx:{patients:-5,sched:[['pratt_mp',1]]},o:`He is not happier. He writes to his MP. And the paper.`},o:`He registers across town. The practice across town sends you a bottle of wine.`}
 ]},

{id:'pratt_mp',arc:1,who:'mp',title:'A letter from Westminster',
 text:`Sir Geoffrey Pomfrey MP has written about "serious concerns raised by a constituent". He would be "delighted to visit and see the challenges first-hand", ideally with a photographer.`,
 choices:[
  {t:'Invite him to shadow a Monday',fx:{you:-3,patients:4},alt:{p:0.4,fx:{patients:-2,you:-3},o:`He stays 40 minutes, takes a selfie with the flu vaccines, and announces "more funding for GPs" that turns out to be last year's funding.`},o:`He sees the 8am queue, sits in on triage, and goes quiet. He writes a column about it. It is weirdly good.`},
  {t:'Reply with a factual letter and some statistics',fx:{you:-1,safety:1},o:`His office replies thanking you for your "valuable insights". Nothing else happens, which counts as a win.`}
 ]},

{id:'abuse',who:'kayleigh',title:'On the front line',
 text:`A man has been shouting at Kayleigh for ten minutes because his repeat prescription "should have been done already". It was requested 40 minutes ago. Kayleigh is 22. She is shaking.`,
 choices:[
  {t:'Zero tolerance: warning letter, then removal',fx:{team:6,patients:-2},o:`The letter goes out. The team notices you backed them. That matters more than you realise.`},
  {t:'Step out and de-escalate it yourself',fx:{team:3,you:-3,patients:1},o:`You calm him down. It takes 15 minutes you did not have. Kayleigh brings you a tea later without being asked.`},
  {t:'Fit panic alarms and a proper screen (£2,000)',fx:{team:4,safety:2,cash:-2},o:`The installer asks if you'd like the bulletproof option. You pause for longer than you'd like to admit.`}
 ]},

{id:'aldi',who:'kayleigh',title:'An offer from Aldi',cond:()=>S.staff.recep>=3,
 text:`"Aldi have offered me £1.60 an hour more," Kayleigh says, "and nobody at Aldi has ever called me a jumped-up little secretary." She does not want to leave. She also does not want to be poor.`,
 choices:[
  {t:'Match it, and rise the whole reception team',fx:{team:8},run(){ S.payX=(S.payX||0)+1.1; },o:`The team gets a raise. It costs about £1,100 a month. Reception morale is the best it has been in years.`},
  {t:'Match it for Kayleigh only',fx:{team:-2},run(){ S.payX=(S.payX||0)+0.25; },o:`She stays. Everyone finds out within the hour. Reception has a new topic of conversation.`},
  {t:'Wish her well',fx:{team:-5},run(){ S.staff.recep--; },o:`She goes. The Aldi on the bypass now has the best customer service in the county.`}
 ]},

{id:'bingo',who:'patient',title:'A home visit request',
 text:`"Mum can't possibly come to the surgery. She's too frail." The request comes in at 11:40. Kayleigh adds: "She's at bingo on Thursdays though. Won £40 last week."`,
 choices:[
  {t:'Visit anyway after morning surgery',fx:{you:-3,patients:2},o:`She's fine. She's also delightful, and she has a leg ulcer nobody knew about. Worth it, on balance.`},
  {t:'Offer a phone consultation first',fx:{patients:-1},o:`Daughter is outraged. Mum is on speakerphone, and it turns out she only wanted her pills changing.`},
  {t:'Send the paramedic',need:()=>S.staff.para>0,why:'You don\'t have a paramedic',fx:{patients:1,you:1},o:`The paramedic goes. Mum asks her about bingo tips. They are now friends.`}
 ]},

{id:'care_home',who:'icb',title:'The care home',
 text:`The 64-bed care home on Mill Lane has lost its GP practice. The ICB asks if you'll take it on: weekly ward rounds, anticipatory care plans, and around 40 calls a week. They'll pay for it.`,
 choices:[
  {t:'Take it on',fx:{list:64,demand:2,patients:2},run(){ addMod({id:'carehome',label:'Care home enhanced service',months:99,fx:{cash:1.4}}); },o:`Ward round on Tuesdays. The care home staff are wonderful. The paperwork is not. £1.4k a month and a lot of phone calls.`},
  {t:'Decline. You can\'t cover it safely.',fx:{you:1,patients:-1},o:`Jonathan sighs audibly on the call. The home goes to the practice across town, who complain about it at every PCN meeting.`}
 ]},

{id:'estate',who:'bev',title:'Six hundred new homes',cond:()=>S.practiceKey!=='city',
 text:`The new estate on the old airfield is finished: 600 homes, one pub, no new surgery. The Section 106 money for "healthcare infrastructure" has been spent on a roundabout.`,
 choices:[
  {t:'Register everyone who comes',fx:{list:520,team:-2,patients:2},o:`Five hundred new patients in two months. More money, more demand, and a lot of toddlers with ears.`},
  {t:'Apply to close the list temporarily',fx:{list:180,team:2},alt:{p:0.5,fx:{list:520,team:-3,you:-2},o:`The ICB refuses. The patients come anyway.`},o:`The ICB agrees to a short closure. Some patients come anyway, via "boundary exceptions" Bev has never heard of.`}
 ]},

{id:'mounjaro',who:'patient',title:'New year, new jab',months:[8,9,10],
 text:`It's January. Forty-one online requests this week say some version of "I want Mounjaro". Three attach photos of a friend who "lost four stone". The phased NHS eligibility criteria fit on one page. The demand does not.`,
 choices:[
  {t:'Set up a structured weight clinic',fx:{demand:1.5,team:-2,patients:3},run(){ addMod({id:'weight',label:'Weight management clinic',months:3,fx:{cash:0.8}}); },o:`Maureen runs it. Criteria, counselling, follow-up. It is actually good care. It is also a lot of it.`},
  {t:'Apply the criteria strictly and explain why',fx:{patients:-3,safety:1},o:`Most people understand. One writes to the Daily Mail. The Mail is not interested in the eligibility criteria.`},
  {t:'Point people to private providers',fx:{patients:-1,you:1,inbox:25},o:`Private prescribing surges. So do the letters asking you to "please monitor".`}
 ]},

{id:'shared_care',who:'raj',title:'Please could the GP...',
 text:`Raj has 23 requests from private clinics asking you to take over prescribing and monitoring. There are no commissioned shared care agreements for most of them. "What's our policy?" he asks. You don't have one.`,
 choices:[
  {t:'Accept them all to keep patients happy',fx:{patients:3,safety:-4,inbox:40},o:`Twenty-three new monitoring schedules. Six have no baseline bloods. Raj starts a spreadsheet with a skull emoji in the title.`},
  {t:'Write a policy: no agreement, no shared care',fx:{patients:-3,safety:3,you:1},o:`Patients are unhappy. Some are fairly unhappy. But now there's a clear answer, and it's written down, and Raj stops twitching.`},
  {t:'Case by case',fx:{you:-3,safety:1},o:`Each one takes 20 minutes. You approve nine. Raj respects you but also looks tired.`}
 ]},

{id:'google_review',who:'kayleigh',title:'One star',
 text:`New Google review: "⭐ Receptionist looked at me funny. Doctor was 7 minutes late. Parking a disgrace. Would not recommend." It's the fourth this month. Your average is now 2.1.`,
 choices:[
  {t:'Reply publicly and politely',fx:{patients:1,you:-1},alt:{p:0.4,fx:{patients:-2,you:-2},o:`He replies to your reply. Then his cousin does. It becomes a thread.`},o:`"Thank you for your feedback, we're sorry..." It's bland and perfect. Nobody reads it.`},
  {t:'Ask happy patients to leave reviews',fx:{patients:3,team:2},o:`Mrs Higgins leaves one. It is 600 words long and mentions the shortbread. Your average climbs to 3.4.`},
  {t:'Never look at Google reviews again',fx:{you:2},o:`Liberating. You mute the notifications and feel ten years younger.`}
 ]},

{id:'gift',who:'patient',title:'A token of thanks',months:[8],
 text:`A grateful patient leaves a bottle of 18-year-old single malt at reception with a card: "For the doctor who found my cancer early." It is worth about £120.`,
 choices:[
  {t:'Accept, and record it in the gifts register',fx:{you:4,safety:1},o:`You write it in the register, as the rules require. Then you write the patient a card back. You keep that card for years.`},
  {t:'Raffle it for the staff Christmas fund',fx:{team:4},o:`Maureen wins. She doesn't drink whisky. She sells it to Alan for £60 and buys the team doughnuts.`}
 ]},

{id:'dna',who:'bev',title:'Did not attend',
 text:`Last month 186 appointments were booked and not attended. That's about 30 GP sessions. Bev has made a poster. It says "186 PEOPLE WASTED APPOINTMENTS LAST MONTH" in red capital letters.`,
 choices:[
  {t:'Automated text reminders with an easy cancel link',fx:{cash:-0.5,demand:-1.5,patients:1},o:`DNAs drop by a third. The text also says "Reply CANCEL". Three people reply "CANCEL MY ACCOUNT". It is not that kind of service.`},
  {t:'Put the poster up',fx:{patients:-2,demand:-0.5},o:`The people who read the poster are the people who came. They feel told off.`},
  {t:'Leave it. Some of them had reasons.',fx:{you:1},o:`Fair. Some of them did. Some of them were at bingo.`}
 ]},

{id:'queue_rain',who:'kayleigh',title:'Queue in the rain',months:[7,8,9,10],
 text:`It's 7:40am and there are 30 people queuing outside in the rain. Someone has brought a camping chair. You have total triage. They know. They came anyway because "the phones never answer".`,
 choices:[
  {t:'Open early, hand out tea, triage at the door',fx:{patients:4,team:-3,you:-2},o:`The camping chair man turns out to have pneumonia. Door triage works. It also takes two receptionists off the phones.`},
  {t:'Keep the doors shut until 8, stick to the system',fx:{patients:-3,team:1},o:`At 8:00 the doors open and 30 damp, furious people all ask for "just a quick word".`}
 ]},

{id:'med_student',who:'med',title:'A student for the summer',months:[2,3,4,5],
 text:`The medical school asks if Oliver, a third-year student, can sit in for four weeks. He is keen, polite, and has never seen a patient over 30 who wasn't in a hospital bed.`,
 choices:[
  {t:'Take him. Teaching is why you became a doctor.',fx:{you:2,team:2,cash:0.8},o:`He is brilliant with Mrs Higgins. At the end he says he wants to be a GP. You tell him to think very carefully, and to go ahead.`},
  {t:'Not this year',fx:{you:1},o:`He goes to dermatology. He sends a photo from the conference in Barcelona.`}
 ]},

{id:'training',who:'pcn',title:'Become a training practice?',months:[0,1,2],
 text:`The deanery is desperate for training places. If you become a GP trainer, you'll get a registrar from August. Six months of trainer's course first. "It's rewarding," Clare says. "And the grant helps."`,
 choices:[
  {t:'Sign up. Grow your own GPs.',fx:{you:-4,team:2},run(){ addMod({id:'registrar',label:'GP registrar in post',months:8,at:4,capAdd:70,fx:{cash:0.7,you:-1}}); },o:`Trainer's course on Thursday evenings. Dr Ellie Chen will join in August. You buy a book about Balint groups.`},
  {t:'Not this year',fx:{you:1},o:`Maybe next year. Probably next year. You say that every year.`}
 ]},

{id:'reg_crisis',who:'reg',title:'A registrar in the doorway',cond:()=>hasMod('registrar')&&S.month>=5,
 text:`Ellie is in your doorway at 5:50pm. "Sorry. I've got a baby with a temperature and a rash, and I just need to run it past you." The last three times, she was right.`,
 choices:[
  {t:'Go and see the baby with her',fx:{you:-2,safety:3,team:2},o:`It's a viral rash. You go through the traffic-light features together. She'll be a very good GP.`},
  {t:'Talk it through, then trust her judgement',fx:{you:1,safety:1},o:`She's got it right. She wanted to be told. You tell her. That's supervision.`}
 ]},

{id:'pay_award',who:'bev',title:'The pay award',months:[0,1,2],
 text:`Staff have seen the news: NHS Agenda for Change staff are getting a pay rise. Your staff aren't on Agenda for Change, but they can read. The contract uplift for staff pay was, in Bev's words, "a joke".`,
 choices:[
  {t:'Match it in full',fx:{team:7},run(){ S.payX=(S.payX||0)+1.8; },o:`About £1,800 a month more on the payroll. The team is grateful, and says so. The accountant says something else.`},
  {t:'Give half',fx:{team:-1},run(){ S.payX=(S.payX||0)+0.9; },o:`It is received with resignation, which is better than resignations.`},
  {t:'Nothing this year',fx:{team:-9},o:`Maureen asks to see the partners' drawings. You change the subject. She notices.`}
 ]},

{id:'bev_retire',who:'bev',title:'Bev has news',months:[5,6,7,8,9],
 text:`Bev sits down. "I'm 64. My husband wants to buy a caravan. I'm thinking of retiring at Christmas." Bev is the only person who knows the password to the payroll system, the smartcard admin and the alarm code.`,
 choices:[
  {t:'Offer a retention bonus and three days a week (£3k)',fx:{cash:-3,team:3},o:`She takes it. "Three days. And I'm not doing CQC again." Fair.`},
  {t:'Recruit a new practice manager',fx:{team:-3,you:-2},run(){ addMod({id:'newpm',label:'New practice manager settling in',months:3,fx:{safety:-2,you:-1}}); },o:`The new manager is sharp and has an MBA. It will take her three months to find where Bev kept everything.`},
  {t:'Promote Sharon, the deputy',fx:{team:2},alt:{p:0.4,fx:{team:-3,safety:-3},o:`Sharon is overwhelmed by week two. Bev comes in "just on Tuesdays" to help. Unpaid. Somehow it's worse.`},o:`Sharon is brilliant. It turns out she's been doing half of Bev's job for years.`}
 ]},

{id:'maureen_course',who:'maureen',title:'The diabetes course',
 text:`Maureen wants to do an advanced diabetes course: two days a month for three months, paid by the practice. "Then I can start insulin myself. I'm fed up of waiting for you lot."`,
 choices:[
  {t:'Pay for it (£1,200) and cover her sessions',fx:{cash:-1.2,team:3,qof:4},o:`She comes back with a certificate and a new level of authority, which previously you didn't think possible.`},
  {t:'Not now, maybe next year',fx:{team:-4},o:`She takes it well. Then she books the course herself and asks for study leave. She knows the rules better than you.`}
 ]},

{id:'xmas_party',who:'bev',title:'The Christmas do',months:[8],
 text:`Christmas party. Last year's was a curry and a quiz that ended with the nurses and reception not speaking until February. What's the plan?`,
 choices:[
  {t:'Proper night out, practice pays (£2,500)',fx:{team:9,cash:-2.5},o:`A three-course dinner, a DJ and a group photo nobody is allowed to post. Maureen and Kayleigh do the Macarena together. Peace is restored.`},
  {t:'Secret Santa and mince pies',fx:{team:2},o:`You get a mug that says "I survived a partners' meeting". It's accurate.`},
  {t:'Cancelled due to winter pressures',fx:{team:-7,cash:0.5},o:`Everyone understands. Everyone also remembers.`}
 ]},

{id:'fish',who:'maureen',title:'The microwave incident',
 text:`Somebody has microwaved fish in the staff kitchen. Again. There is an unsigned note on the fridge. There is a counter-note. The counter-note has been annotated.`,
 choices:[
  {t:'Buy a second microwave, for fish only (£90)',fx:{team:3,cash:-0.1},o:`The fish microwave gets its own laminated sign. It is the best £90 you spend all year.`},
  {t:'Write a kitchen policy',fx:{team:-2,safety:1},o:`Policy KIT-01, version 1.0. It is ratified at a staff meeting. It is ignored by Thursday.`},
  {t:'Stay out of it',fx:{team:-1,you:1},o:`The note war escalates to Post-its on your door. You are Switzerland.`}
 ]},

{id:'cat',who:'cat',title:'A new team member',
 text:`A ginger cat has moved into the car park. Staff have named it QOF. It sleeps on the bonnet of whichever car is warmest. Someone has already bought it a bowl.`,
 choices:[
  {t:'Adopt QOF. Every practice needs a mascot.',fx:{team:7,safety:-2},o:`QOF gets a collar, a bed in the admin office and an Instagram account with more followers than the practice.`},
  {t:'Call the cat rescue',fx:{team:-4,safety:1},o:`QOF goes to a lovely home. The staff room is quieter. Someone puts up a "missing you" poster.`},
  {t:'Unofficially tolerate QOF',fx:{team:3},alt:{p:0.3,fx:{team:2,safety:-4},o:`The CQC report contains the sentence "a cat was observed in the dispensary".`},o:`QOF is fed "by nobody". Four bowls appear. QOF gets fat.`}
 ]},

{id:'wfh',who:'bev',title:'Working from home',
 text:`The admin team asks if they can work from home two days a week. "We only type letters and code documents. We could do it in our pyjamas." Two of them already look like they do.`,
 choices:[
  {t:'Yes. Laptops and smartcard readers (£1,500)',fx:{team:6,cash:-1.5,inbox:-40},o:`Productivity goes up. Nobody knows why. Everyone suspects the lack of Derek Pratt at the front desk.`},
  {t:'No. We need people in the building.',fx:{team:-4},o:`They accept it. Two start looking at NHS admin jobs that offer hybrid working.`}
 ]},

{id:'noro',who:'maureen',title:'Norovirus',months:[7,8,9,10],
 text:`Norovirus is working its way through the staff. Four people are off. Maureen is in, but green. She insists she's fine, then leaves the room at speed.`,
 choices:[
  {t:'Send everyone symptomatic home for 48 hours',fx:{safety:3,team:2},run(){ addMod({id:'noro',label:'Norovirus: staff off sick',months:1,capMul:0.9}); },o:`Capacity drops for the month. The outbreak stops with your staff, not your patients.`},
  {t:'Soldier on, it\'s winter',fx:{team:-4,safety:-4},alt:{p:0.4,fx:{team:-6,safety:-6,patients:-3},run(){ addMod({id:'noro2',label:'Norovirus outbreak',months:1,capMul:0.8}); },o:`It spreads to three patients and the care home. The outbreak team becomes your pen pal.`},o:`You get away with it. Nobody feels good about it.`}
 ]},

{id:'whatsapp',who:'kayleigh',title:'WhatsApp',
 text:`There's a row in the staff WhatsApp group. It started about who restocks the printer paper. It is now about "respect" and "some people". It has 214 messages. You're in the group.`,
 choices:[
  {t:'Get the two sides in a room with biscuits',fx:{team:5,you:-2},o:`It turns out nobody knew whose job the printer was. Now Sharon knows. It is Sharon.`},
  {t:'Mute the group. Forever.',fx:{you:3,team:-2},o:`Blissful silence. You miss the message about the fire drill.`}
 ]},

{id:'pcn_arrs',who:'pcn',title:'Free staff!',cond:()=>arrsCount()<ARRS_CAP,
 text:`Clare from the PCN has unspent ARRS budget. "Would you like a mental health practitioner? Fully funded. They start next month." The PCN will pay. The question is where they'll sit.`,
 choices:[
  {t:'Yes, find them a room',fx:{staff:{mhp:1},patients:2},o:`They start next month. Patients who needed longer than ten minutes finally get it. You need to find a room.`},
  {t:'No room at the inn',fx:{you:1},o:`The funding goes to the practice across town, which has a portakabin.`}
 ]},

{id:'rooms',who:'bev',title:'Room for everyone?',cond:()=>roomsNeeded()>S.rooms,
 text:`Every consulting room is double booked on Tuesdays. The physio is working in the baby-changing room. "We need more space," Bev says, "or fewer people. And we need the people."`,
 choices:[
  {t:'Convert the staff room into a clinic room',fx:{rooms:1,team:-6},o:`The staff room is now Room 11. Lunch is eaten in the corridor. Morale takes it personally.`},
  {t:'Hire a portakabin for the car park (£14,000)',fx:{rooms:2,cash:-14},o:`It arrives on a lorry. It has air conditioning and a ramp. It is the nicest room in the building.`},
  {t:'Hot-desk and rota harder',fx:{team:-2,you:-2},o:`Bev builds a room rota on a spreadsheet so complex it becomes self-aware.`}
 ]},

{id:'pcn_meeting',who:'pcn',title:'Neighbourhood transformation',
 text:`The PCN board meets Tuesday 1-5pm: "Integrated Neighbourhood Teams: a transformation journey." There will be sticky notes. Your attendance is "strongly encouraged".`,
 choices:[
  {t:'Go. Someone has to represent the practice.',fx:{you:-3,cash:0.6,team:1},o:`Four hours of sticky notes. You secure a share of the new frailty funding and eat a surprising number of free biscuits.`},
  {t:'Send Bev',fx:{team:-1},o:`Bev comes back with a new acronym and a quiet fury.`},
  {t:'Skip it',fx:{you:2},alt:{p:0.4,fx:{you:1,cash:-1},o:`The PCN divides the new money between practices who turned up.`},o:`Nothing happens. It often doesn't.`}
 ]},

{id:'pcn_cd',who:'pcn',title:'A promotion?',months:[2,3,4,5,6],
 text:`Clare is stepping down as PCN Clinical Director. "You'd be great," she says. "It pays for two sessions a week, and you get a lanyard." There are 11 practices in the PCN, and each has opinions.`,
 choices:[
  {t:'Accept the role',fx:{team:1},run(){ addMod({id:'cd',label:'PCN Clinical Director',months:99,fx:{cash:1.3,you:-2}}); },o:`You are now responsible for eleven practices' worth of opinions. The money is useful. The meetings are not.`},
  {t:'Decline',fx:{you:2},o:`Someone else gets the lanyard. You sleep well.`}
 ]},

{id:'collective',who:'lmc',title:'Collective action',months:[1,2,3,4,5,6,7],
 text:`The LMC is urging practices to adopt safe working: a cap of 25 patient contacts per clinician per day, with overflow to local hubs. "It's about safety," Steve says. "Also sanity."`,
 choices:[
  {t:'Implement the safe working cap',fx:{patients:-3},run(){ addMod({id:'safe',label:'Safe working cap',months:99,capMul:0.94,fx:{you:2,team:1}}); },o:`Lists stop at 25. The overflow goes to the hub, which is full by 10am. But you leave by 7pm for the first time since you qualified.`},
  {t:'Carry on as normal',fx:{you:-1},o:`You keep going. So does the queue.`}
 ]},

{id:'survey_bad',who:'paper',title:'GP Patient Survey',months:[3],cond:()=>S.st.patients<50,
 text:`The GP Patient Survey results are out. {surgery}: "ease of getting through on the phone" is in the bottom 10% nationally. The {paper} has made a league table.`,
 choices:[
  {t:'Publish an action plan in the waiting room',fx:{patients:2,you:-2},o:`It's honest, specific and has dates on it. Somebody writes "LOL" on it in biro.`},
  {t:'Point out that 84 people responded',fx:{patients:-2,you:1},o:`Statistically, you are correct. Emotionally, nobody cares.`}
 ]},

{id:'survey_good',who:'paper',title:'GP Patient Survey',months:[3],cond:()=>S.st.patients>=50,
 text:`The GP Patient Survey results are out. {surgery} is above the national average for "overall experience". The {paper} runs it on page 11, next to the marrow.`,
 choices:[
  {t:'Buy the team cake',fx:{team:4,cash:-0.1},o:`You tell the team it's their result. It is.`},
  {t:'Frame the page for reception',fx:{team:2,patients:1},o:`It hangs next to the sign about abusive behaviour. Nice balance.`}
 ]},

{id:'appraisal',who:'you',title:'Appraisal season',
 text:`Your appraisal is due. You need a year of CPD reflections, a quality improvement activity, patient feedback and a reflection on a significant event. You have one reflection, written in 2024. It is about burnout.`,
 choices:[
  {t:'Spend the weekend on the portfolio',fx:{you:-4,safety:2},o:`Your appraiser praises your "rich reflective practice". You reflect on how much you'd like your weekend back.`},
  {t:'Ask to defer it three months',fx:{you:2},o:`Deferred. The problem is now in March, alongside QOF, the accounts and the new contract. Great.`}
 ]},

{id:'nativity',who:'home',title:'The nativity',months:[8],
 text:`It's the school nativity at 2pm on Thursday. Your child is playing "Third Sheep". They have been practising their "baa" for a week. You have a 14-patient afternoon list.`,
 choices:[
  {t:'Cancel the afternoon. You\'re going.',fx:{you:9,patients:-2,team:-1},o:`Third Sheep's "baa" is magnificent. You film all of it. You watch it again at 11pm while doing the results.`},
  {t:'Ask a partner to cover',need:()=>activeOthers()>0,why:'There\'s nobody left to ask',fx:{you:6,team:-2},o:`They cover. You owe them. You'll be paying that back in February.`},
  {t:'Stay. Someone has to see the patients.',fx:{you:-9},o:`You get a video on WhatsApp at 2:47pm. You watch it between patients 9 and 10. It's the only good part of the day.`}
 ]},

{id:'lunch',who:'you',title:'Lunch',
 text:`You realise you haven't eaten lunch since Tuesday. Today's lunch so far is a Rich Tea biscuit and half a banana a patient's child gave you.`,
 choices:[
  {t:'Block 30 minutes every day. Protected.',fx:{you:6,patients:-2},o:`It feels radical. It shouldn't. You eat a sandwich sitting down and nearly cry.`},
  {t:'Keep going. Lunch is for the weak.',fx:{you:-4,patients:1},o:`You finish the day on four coffees and the other half of the banana.`}
 ]},

{id:'dinner',who:'home',title:'"Home for dinner?"',
 text:`"Will you be home for dinner this week?" The question is gentle. The subtext is not. You worked until 8:40pm every night last week.`,
 choices:[
  {t:'Promise Wednesday. Mean it.',fx:{you:5},alt:{p:0.35,fx:{you:-5},o:`At 6:15pm Wednesday a patient collapses in the waiting room. You get home at 9. The dinner is in the oven, under foil, with a note.`},o:`You're home at 6:30. There is pasta, and nobody talks about the practice for three whole hours.`},
  {t:'"After QOF year end. I promise."',fx:{you:-4},o:`It's not the first time you've said it. You notice they don't reply.`}
 ]},

{id:'gmc',who:'you',title:'A letter from the GMC',w:0.5,
 text:`A brown envelope. The GMC has received a complaint about you from a patient whose request for a sick note you declined. They are "assessing whether it requires investigation". Your stomach falls through the floor.`,
 choices:[
  {t:'Ring your medical defence organisation',fx:{you:-6},run(){ schedule('gmc_closed',2); },o:`The adviser is calm. "We see these all the time. Send me your notes." It helps, a bit.`},
  {t:'Deal with it yourself',fx:{you:-10},alt:{p:0.5,fx:{you:-12,safety:-2},o:`You write a long, defensive response at 2am. Your defence organisation later calls it "a learning opportunity".`},run(){ schedule('gmc_closed',2); },o:`You draft a careful, factual response. Four drafts. No sleep.`}
 ]},

{id:'gmc_closed',arc:1,who:'you',title:'Case closed',
 text:`The GMC writes: "no further action". The complaint did not meet the threshold for investigation. It took eleven weeks. You'll remember them for considerably longer.`,
 choices:[{t:'Breathe',fx:{you:8},o:`You go for a walk at lunchtime, the first in months. The sky is enormous.`}]}
);
/* ===================== EVENTS 3: money, safety, systems ===================== */
EVENTS.push(
{id:'fridge',who:'maureen',title:'The vaccine fridge',
 text:`Monday morning. The vaccine fridge data logger shows it reached 11°C for about six hours over the weekend. Inside: £7,000 of vaccines. Maureen is holding the logger like it's a murder weapon.`,
 choices:[
  {t:'Quarantine the stock and ring the manufacturers for stability advice',fx:{you:-2,safety:4,cash:-2.5},o:`About two thirds is fine according to the manufacturers' data. The rest goes in the bin. You write it up as a significant event. The system works.`},
  {t:'Bin the lot, to be safe',fx:{cash:-7,safety:3},o:`£7,000 into the pharmaceutical waste bin. Safe, expensive and, it turns out, partly unnecessary.`},
  {t:'"They\'re probably fine."',fx:{safety:-4},alt:{p:0.4,fx:{safety:-16,cash:-7,patients:-5},o:`It comes out at a routine audit. 140 patients need recalling for revaccination. The local paper finds out.`},o:`Nobody ever finds out. You find out every night at about 3am, in your head.`}
 ]},

{id:'sea_referral',who:'bev',title:'A significant event',
 text:`A suspected cancer referral you made three weeks ago was never sent. It was sitting in a drafts folder. The patient rang to ask why she hasn't heard anything. She is 58 with a breast lump.`,
 choices:[

{id:'hospital_discharge',who:'hospital',title:'The Christmas clear-out',months:[8],
 text:`It's 23rd December. St Swithin's has discharged 38 of your patients in two days to free beds. Every discharge letter ends "GP to follow up bloods in one week and review medications". The first week of January is going to be busy.`,
 choices:[
  {t:'Bounce the inappropriate requests back',fx:{inbox:40,team:1,safety:-1},o:`You send a polite template about the hospital arranging its own tests. Half come back to you anyway, in January.`},
  {t:'Just do them all',fx:{inbox:80,you:-4,safety:2,patients:2},o:`Raj and you work through them on Christmas Eve. Every one gets done. You eat a mince pie from the reception tin, standing up.`}
