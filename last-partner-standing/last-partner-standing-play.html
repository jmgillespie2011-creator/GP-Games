  {t:'All hands: weekend prep marathon',fx:{safety:9,team:-6,you:-5},o:`Policies updated, fridges logged, the emergency drugs box has in-date adrenaline. Everyone is exhausted.`},
  {t:'Hire a CQC consultant (£5,000)',fx:{safety:10,cash:-5,team:-1},o:`Gavin arrives with 400 pages of templates and a lanyard that says "Compliance Is Care".`},
  {t:'"We are always inspection-ready."',fx:{you:1},o:`You say this with confidence. Bev writes something in her notebook and underlines it twice.`}
 ],
 after(){ schedule('cqc_visit',1); }},

{id:'cqc_visit',arc:1,who:'cqc',title:'Inspection day',tag:'rule',src:['S33'],
 info:'The rating for each key question comes from evidence: your records and policies (safety), outcomes such as QOF (effective), patient feedback (caring), access (responsive) and leadership and culture (well-led).',
 text:`Patricia Sharpe arrives at 8:29 with a clipboard, a lanyard and an expression you can't read. She'd like to see the fridge logs, the significant event log, the complaints file, and "just how things really are".`,
 choices:[{t:'Show her how things really are',run(){ return runCQC(); }}]},

{id:'qof_yearend',arc:1,who:'bev',title:'Six weeks to go',tag:'rule',src:['S3','S13'],
 info:'QOF achievement is measured on 31 March. Points scale between lower and upper thresholds for each indicator. The balance above your aspiration payments is paid by the end of June.',
 text:()=>`"QOF year end is 31st March. We're at ${Math.round(S.qof)}%." Each 1% is worth about £${Math.round(qofValueK(1)*1000).toLocaleString('en-GB')}, paid next June. Bev has printed the list of patients still missing their reviews. It's the thickness of a paperback.`,
 choices:[
  {t:'Saturday recall clinics for the rest of the year',fx:{qof:9,you:-5,team:-4,cash:-1.5},o:`Four Saturdays of spirometry, foot checks and blood pressures. Maureen does her last one wearing a tiara for reasons nobody explains.`},
  {t:'Text blast, and exception-report where it\'s genuinely justified',fx:{qof:4,safety:-1},o:`The team sends 1,100 texts. Twelve people reply "STOP". One replies with a photo of their cat.`},
  {t:'Accept fate',fx:{you:2},o:`You decide QOF is a construct. The accountant will tell you in June exactly how expensive this construct is.`}
 ]},

{id:'contract_new',arc:1,who:'dept',title:'Next year\'s contract',tag:'speculative',
 info:'Contract changes for the following April are usually announced between February and March, leaving practices weeks to plan. The details of the 2027/28 contract in this card are invented.',
 text:()=>`The GP contract for ${2027 + (S.yr || 0)}/${28 + (S.yr || 0)} has been announced. It was trailed in a Sunday paper, confirmed on breakfast radio, and reached the practice on 28th March. It starts on 1st April. It's 94 pages long.`,
 choices:[
  {t:'Read all 94 pages tonight',fx:{you:-3,safety:2},o:`Page 61 contains a new requirement. Page 88 contains the funding for it, which is less than the cost of doing it.`},
  {t:'Wait for the LMC summary',fx:{you:2},o:`The LMC summary arrives two days later. It's two pages long and mostly swearing, professionally phrased.`}
 ]},

{id:'mini_docman',kind:'mini',game:'docman',rep:1,max:3,who:'bev',title:'Docman Dash',w:()=>S.inbox>350?2:1.1,tag:'story',
 text:`The document inbox has {inbox} items in it. Bev asks if you want to blitz some yourself between patients. Letters, results and requests: file it, action it, flag it urgent, or bounce it back to where it belongs.`,
 choices:[
  {t:'Grab a coffee and blitz it (45-second game)',play:1},
  {t:'Delegate: pay the admin team overtime to pre-sort',fx:{inbox:-60,cash:-0.6},later:[{in:1,p:0.25,fx:{safety:-3},note:'Because the admin team pre-sorted the inbox under pressure: an urgent potassium sat in "routine" for two days.'}],o:`They sort 60 items. It's mostly fine.`}
 ]},

{id:'mini_triage',kind:'mini',game:'triage',rep:1,max:3,who:'kayleigh',title:'The 8am Rush',w:1.1,tag:'rule',src:['S1'],
 info:'Under the 2026/27 contract, practices can\'t cap online requests. Urgent needs must be dealt with the same day and non-urgent ones by the end of the next working day. Good care navigation sends patients straight to the right service.',
 text:`08:00. The phone queue says 63. The online form has 41 new requests, and under this year's contract you can't switch it off. Kayleigh looks at you with the eyes of a soldier in a war film. "Can you help triage?"`,
 choices:[
  {t:'Take the hot seat (45-second game)',play:1},
  {t:'Let reception work through the template',fx:{patients:-1,demand:0.5},o:`The template does its best. Three sore throats get GP appointments, and a sprained ankle waits for a paramedic call-back.`}
 ]}
);
/* ===================== EVENTS 2: patients, team, you ===================== */
EVENTS.push(
{id:'higgins_list',who:'higgins',title:'The list',tag:'story',
 text:`Mrs Higgins has brought a list. It's double-sided. Item one is her knee. Item five, in smaller writing, says "chest goes tight on the stairs, probably nothing". She has also brought you a tin of shortbread.`,
 choices:[
  {t:'Work through all seven items',fx:{patients:4,you:-4,rep:1},later:[{in:1,p:0.6,fx:{safety:2,rep:1},note:'Mrs Higgins\' ECG, from item five of her list, showed atrial fibrillation. She\'s now on anticoagulation. Good catch.'}],o:`Forty minutes later you're 35 minutes behind, but you've booked an ECG for item five. The shortbread is excellent.`},
  {t:'"Let\'s do the two most important today."',fx:{patients:1,you:-1},later:[{in:1,p:0.5,fx:{safety:2},note:'Mrs Higgins\' ECG showed atrial fibrillation. She chose item five as her second problem. Good instinct, hers.'}],o:`She chooses the knee and, after a pause, item five. You arrange an ECG.`},
  {t:'"One problem per appointment, I\'m afraid."',fx:{patients:-3,you:1},later:[{in:1,p:0.35,fx:{safety:-4,rep:-2,you:-3},note:'Mrs Higgins was admitted with a fast, irregular heart rate. It was item five on the list you didn\'t get to.'},{in:1,p:1,fx:{inbox:12},note:'Mrs Higgins rebooked items two to seven as six separate appointments.'}],o:`She folds the list away without a word. Your clinic runs to time.`}
 ]},

{id:'ai_printout',who:'patient',title:'Dr Chatbot',tag:'story',
 text:[`A 34-year-old man brings a 12-page printout. "I put my symptoms into an AI. It says Addison's disease, lupus, or a rare parasite." He's been exhausted since his baby was born four months ago. He looks it.`, `A retired engineer brings his chatbot conversation, printed in 9-point font and stapled. The AI has offered him six diagnoses, ranked by probability, and drafted a letter asking for a scan. His knee has hurt since he took up pickleball.`],
 choices:[
  {t:'Go through the printout together, properly',fx:{patients:4,you:-3,rep:1},o:`It takes 25 minutes. He leaves reassured, with sensible bloods booked and a plan for sleep. He asks if he can give the AI your feedback.`},
  {t:'Order every test on the list to settle it',fx:{patients:3,inbox:35,cash:-0.3},later:[{in:1,p:0.6,fx:{inbox:25,you:-2},note:'Because you ordered everything on the AI\'s list: one borderline result has generated four more tests and two referrals.'}],o:`Seventeen blood tests. Sixteen will be normal.`},
  {t:'"The internet isn\'t a doctor."',fx:{patients:-4,you:1,rep:-1},o:`He posts a one-star review: "Dismissive. The AI had better bedside manner." It stings because it's a little bit true.`}
 ]},

{id:'antibiotics',who:'patient',title:'Just in case',months:[6,7,8,9,10],tag:'story',
 text:`A mum has taken the afternoon off work because her son's cold "went to his chest last winter and he ended up in hospital". Today his chest is clear and his temperature is 37.1. She's frightened, not demanding.`,
 choices:[
  {t:'Explain viral infections, and give clear safety-netting',fx:{patients:1,safety:2},o:`You tell her exactly what would worry you and when to come back. She writes it down. He's better by Sunday.`},
  {t:'Give a delayed prescription',fx:{patients:2,safety:1},o:`"Only if it isn't better in a few days, or if these things happen." She understands. She doesn't collect it.`},
  {t:'Just give him the amoxicillin',fx:{patients:3,safety:-3},later:[{in:3,p:0.45,fx:{icb:-3,you:-1},note:'The ICB medicines team flagged your antibiotic prescribing rates. There\'s a template to complete.'}],o:`She's relieved. Your antibiotic prescribing data isn't.`}
 ]},

{id:'insurer_letter',who:'insurer',title:'Unfit to travel',tag:'real',src:['S29'],
 info:'Insurance reports and letters are private work. Practices can charge for them, and GPs can only certify what they know from their own records.',
 text:`A travel insurer wants a GP to certify that a patient was "medically unfit to travel" three weeks ago, so they'll pay out on a cancelled holiday. You didn't see her then. There's nothing in the notes.`,
 choices:[
  {t:'Decline, and offer a private letter about what the records show',fx:{patients:-1,safety:2},o:`She pays £35 for a factual letter that says there's no consultation on record. The insurer rejects the claim. She's cross with the insurer, not you.`},
  {t:'Introduce a clear private fee list for letters and reports',fx:{patients:-2,team:2},run(){ addMod({id:'fees',label:'Private fee income',months:99,fx:{cash:0.4}}); },o:`Reception gets a laminated fee list. Requests for "a quick letter" halve. Income from the rest: about £400 a month.`},
  {t:'Write what she needs. It\'s easier.',fx:{patients:2,safety:-4},later:[{in:3,p:0.3,fx:{you:-6,safety:-3},note:'The insurer\'s fraud team has asked for the medical records behind your letter. Your defence organisation is "concerned".'}],o:`You sign it, and lie awake thinking about the phrase "fitness to practise".`}
 ]},

{id:'facebook',who:'paper',title:'The Facebook group',tag:'story',
 text:[`The {place} Community Chat group has a post: "ANYONE ELSE UNABLE TO GET THROUGH TO {surgery}??? 🤬". It has 312 comments. Most are about the phones. They're not wrong about the phones.`, `A new post in the {place} Community Chat group: "Waited three weeks for a phone call from {surgery}. The doctor was LOVELY but why so long???" 187 comments, most of them sharing their own waits. She's not wrong either.`],
 choices:[
  {t:'Post a calm explainer about how to get help',fx:{patients:2,you:-2,rep:3},o:`"Thanks for explaining!!" says one comment. "Typical excuses" says another. Net positive, mostly.`},
  {t:'Ignore it. Never read the comments.',fx:{you:1,rep:-3},o:`You don't read the comments. Bev does, and summarises them for you at length.`},
  {t:'Invite the post\'s author to join the patient group',fx:{you:-1},alt:{p:0.35,fx:{you:-3,rep:-1},o:`She comes. She brings the other 311 commenters' concerns in a ring binder.`},run(){ if(!S._alt) applyFx({rep:5,aim:{patients:1}}); },o:`She comes, listens, and becomes your most ferocious defender online. Nobody saw that coming.`}
 ]},

{id:'pratt_complaint',who:'pratt',title:'A formal complaint',tag:'rule',
 info:'NHS complaints must be acknowledged within three working days, and complainants can escalate to the Parliamentary and Health Service Ombudsman. Many complaints are really about access.',
 text:`Mr Pritchard has written a formal complaint. He was told to ring back at 8am four days running, then offered a routine appointment in three weeks. He has copied in the ICB and his MP. He isn't wrong.`,
 choices:[
  {t:'Invite him in to talk it through',fx:{you:-3,patients:2,rep:2},o:`He talks for an hour about his wife's dementia and why he gets so angry on the phone. At the end he shakes your hand: "First time anyone's listened."`},
  {t:'Send a careful written response',fx:{patients:-1,safety:1},o:`Your response is measured and correct. His reply is longer.`},
  {t:'Suggest he might be happier registered elsewhere',fx:{you:1},alt:{p:0.65,fx:{patients:-4,rep:-4,icb:-2,sched:[['pratt_mp',1]]},o:`He isn't happier. He writes to his MP, and to the paper.`},o:`He registers across town. It doesn't feel like a win.`}
 ]},

{id:'pratt_mp',arc:1,who:'mp',title:'A letter from Westminster',tag:'story',
 text:`Sir Geoffrey Pomfrey MP has written about "serious concerns raised by a constituent". He'd be "delighted to visit and see the challenges first-hand", ideally with a photographer.`,
 choices:[
  {t:'Invite him to shadow a Monday',fx:{you:-3},alt:{p:0.4,fx:{rep:-2,you:-3},o:`He stays 40 minutes, takes a selfie with the flu vaccines, and announces "more funding for GPs" that turns out to be last year's funding.`},run(){ if(!S._alt) applyFx({rep:5,patients:3,icb:2}); },o:`He sees the 8am queue, sits in on triage, and goes quiet. He writes a column about it. It's weirdly good.`},
  {t:'Reply with a factual letter and some statistics',fx:{you:-1,safety:1},o:`His office thanks you for your "valuable insights". Nothing else happens, which counts as a win.`}
 ]},

{id:'abuse',who:'kayleigh',title:'On the front line',max:2,rep:1,tag:'real',src:['S37'],w:()=>S.practiceKey==='city'?2:1,
 info:'In a 2026 study of 1,152 general practice staff, 92.3% had faced verbal abuse and 47.7% physical violence or threats. Reception staff were the most affected.',
 text:`A man has been shouting at Kayleigh for ten minutes because his prescription "should have been done already". It was requested 40 minutes ago. Kayleigh is 22. She's shaking.`,
 choices:[
  {t:'Zero tolerance: warning letter, then removal',fx:{team:6,patients:-1,aim:{team:2}},later:[{in:2,p:0.3,fx:{you:-3,icb:-2,rep:-2},note:'The man you removed complained to the ICB and the local paper that he was "struck off for asking about a prescription". You spent an afternoon on the response.'}],o:`The letter goes out. The team notices you backed them, and they'll remember it.`},
  {t:'Step out and de-escalate it yourself',fx:{team:3,you:-3,patients:1},o:`You calm him down. It takes 15 minutes you didn't have. Kayleigh brings you a tea later without being asked.`},
  {t:'Fit panic alarms and a proper screen (£2,000)',fx:{team:4,cash:-2,aim:{team:1,safety:1}},o:`The installer asks if you'd like the bulletproof option. You pause for longer than you'd like to admit.`}
 ]},

{id:'aldi',who:'kayleigh',title:'An offer from Aldi',cond:()=>S.staff.recep>=3,tag:'real',src:['S18'],
 info:'The National Living Wage rose to £12.71 an hour in April 2026. Practice pay has to compete with supermarkets, and every rise also costs 15% employer NI above £5,000 a year.',
 text:`"Aldi have offered me £1.60 an hour more," Kayleigh says, "and nobody at Aldi has ever called me a jumped-up little secretary." She doesn't want to leave. She also doesn't want to be poor.`,
 choices:[
  {t:'Raise pay for the whole reception team',fx:{team:6,aim:{team:3}},run(){ S.payX=(S.payX||0)+1.1; },o:`The team gets a raise, costing about £1,100 a month. Reception morale is the best it has been in years.`},
  {t:'Match it for Kayleigh only',fx:{team:-1},run(){ S.payX=(S.payX||0)+0.3; addMod({id:'resent',label:'Resentment over a pay rise for one',months:3,aim:{team:-3}}); },o:`She stays. Everyone finds out within the hour.`},
  {t:'Wish her well',fx:{team:-5},run(){ S.staff.recep--; },o:`She goes. The Aldi on the bypass now has the best customer service in the county.`}
 ]},

{id:'home_visit',who:'patient',title:'A home visit request',tag:'story',
 text:`A daughter asks for a home visit for her mum, 88, who "isn't herself". Mum gets a lift to the day centre on Thursdays, so reception isn't sure she qualifies. The home-visit criteria were last updated when the practice still had a fax machine.`,
 choices:[
  {t:'Visit after morning surgery',fx:{you:-3,patients:2,rep:1},o:`She's confused and feverish: a urine infection with delirium. You start treatment and arrange for someone to check in tomorrow. Glad you went.`},
  {t:'Offer a phone consultation first',fx:{patients:-1},later:[{in:1,p:0.3,fx:{patients:-2,safety:-3},note:'The woman you assessed by phone was admitted overnight with delirium from a urine infection.'}],o:`The daughter describes her mum as "a bit muddled". You arrange a urine sample.`},
  {t:'Send the paramedic',need:()=>S.staff.para>0,why:'You don\'t have a paramedic',fx:{patients:1,you:1},o:`The paramedic goes, finds a urine infection with delirium, starts treatment and rings you from the car. This is what the role is for.`}
 ]},

{id:'care_home',who:'icb',title:'The care home',tag:'real',src:['S3','S4'],
 info:'Care home residents count 1.43 times in the funding formula, and PCNs get a care home premium of £133.16 per bed. In return: weekly ward rounds, care plans and a lot of phone calls.',
 text:`The 64-bed care home on Mill Lane has lost its GP practice. The ICB asks if you'll take it on: weekly ward rounds, anticipatory care plans and around 40 calls a week.`,
 choices:[
  {t:'Take it on',fx:{list:64,demand:2,patients:1,icb:4},run(){ S.careBeds+=64; addMod({id:'carehome',label:'Care home ward rounds',months:99,hours:1.5,fx:{cash:0.7}}); },o:`Ward round on Tuesdays. The care staff are wonderful. The funding comes through the formula and the PCN; the phone calls come through you.`},
  {t:'Decline. You can\'t cover it safely.',fx:{you:1,icb:-3},o:`Jonathan sighs audibly. The home goes to the practice across town, who complain about it at every PCN meeting.`}
 ]},

{id:'estate',who:'bev',title:'Six hundred new homes',cond:()=>S.practiceKey!=='city',tag:'real',src:['S3'],
 info:'New registrants count 1.46 times in the global sum for their first year, which reflects the extra work of new patients. The demand arrives with them.',
 text:`The new estate on the old airfield is finished: 600 homes, one pub, no new surgery. The money set aside for "healthcare infrastructure" has been spent on a roundabout.`,
 choices:[
  {t:'Register everyone who comes',fx:{team:-2,rep:2},run(){ S.list+=520; S.newRegs.push({n:520,until:S.month+12}); },o:`Five hundred and twenty new patients in two months. More money, more demand, and a lot of toddlers with ears.`},
  {t:'Apply to close the list',fx:{team:2,icb:-8,rep:-3},alt:{p:0.5,fx:{team:-3,you:-2,icb:-5},run(){ S.list+=520; S.newRegs.push({n:520,until:S.month+12}); },o:`The ICB refuses. The patients come anyway.`},run(){ if(!S._alt){ S.list+=180; S.newRegs.push({n:180,until:S.month+12}); } },o:`The ICB agrees to a short closure. Some patients come anyway, through exceptions Bev has never heard of.`}
 ]},

{id:'mounjaro',who:'patient',title:'"Offered by GPs"',months:[3,4,5,6,7,8,9,10],tag:'real',src:['S76','S77'],
 info:'NICE approved tirzepatide (Mounjaro) for obesity, and since 23 June 2025 ICBs have had to fund it in primary care, phased in over several years. The first people eligible have a BMI of 40 or more and at least four of five weight-related conditions. Practices aren\'t obliged to prescribe it. Whether there is a locally commissioned service (LCS) paying for the diet and activity support, the monitoring and the staff time depends on the ICB, and many practices have had none.',
 text:`New NHS guidance on weight-loss jabs led last night's news: "Mounjaro to be offered by GPs". Forty-one online requests since, most starting "I saw on the news". In this first phase, the NHS criteria are a BMI of 40 or more and four of five weight-related conditions: about a dozen of your patients qualify. Your ICB hasn't commissioned a local service, so there's no money for the support and monitoring that's meant to go with it.`,
 choices:[
  {t:'Prescribe for the eligible few and build the support yourselves, unfunded',fx:{patients:3,team:-2,you:-2,qof:1},run(){ addMod({id:'weight',label:'Unfunded weight management clinic',months:3,demand:1.5,hours:1}); },o:`Maureen runs the checks and follow-ups on top of her diabetes clinics. It's good care. Nobody is paying for it, and the other 29 requests still need a reply.`},
  {t:'Apply the criteria, and wait for a funded local service',fx:{patients:-3,safety:1},later:[{in:2,p:0.5,fx:{rep:-2,patients:-2},note:'The Facebook group is convinced a practice two towns over prescribes Mounjaro to anyone who asks. It doesn\'t.'}],o:`Reception sends a clear message about the criteria. Most people understand. Some are very upset, and you understand why.`},
  {t:'Point people to private providers',fx:{patients:-1,you:1,inbox:25},later:[{in:1,p:1,fx:{inbox:30},note:'Private weight-loss prescribers have sent 30 letters asking you to "please monitor".'}],o:`Private prescribing surges, and so do the letters about it.`},
  {t:'Press the ICB, with the PCN, to commission a proper service',fx:{you:-1,icb:-1},later:[{in:3,p:0.5,fx:{cash:2,team:1},note:'The ICB has commissioned a weight management LCS. Funding and a shared dietitian arrive.'}],o:`The PCN writes to the ICB with the numbers. The reply says a service is "being scoped".`}
 ]},

{id:'shared_care',who:'raj',title:'Please could the GP...',tag:'real',src:['S25'],
 info:'Shared care, where a GP takes over prescribing and monitoring from a specialist, is voluntary and should come with an agreement. Unfunded requests from private providers became a flashpoint in the BMA\'s 2025/26 dispute.',
 text:`Raj has 23 requests from private clinics asking you to take over prescribing and monitoring. There are no shared care agreements for most of them. "What's our policy?" he asks. You don't have one.`,
 choices:[
  {t:'Accept them all to keep patients happy',fx:{patients:3,safety:-4,inbox:40},later:[{in:2,p:0.4,fx:{safety:-5,you:-3},note:'A patient on one of the private shared-care requests went four months without monitoring bloods.'}],o:`Twenty-three new monitoring schedules. Six have no baseline bloods. Raj starts a spreadsheet with a skull in the title.`},
  {t:'Write a policy: no agreement, no shared care',fx:{patients:-3,safety:3,you:1,aim:{safety:1}},o:`Some patients are unhappy, and you understand why. But now there's a clear answer, written down, and Raj stops twitching.`},
  {t:'Case by case',fx:{you:-3,safety:1},o:`Each one takes 20 minutes. You approve nine. Raj respects you but also looks tired.`}
 ]},

{id:'google_review',who:'kayleigh',title:'One star',tag:'real',src:['S34'],
 info:'Nationally, about 57% of patients find it easy to contact their practice by phone. Online reviews mostly reflect that first contact.',
 text:[`New review: "⭐ Rang 47 times. Gave up. Staff lovely once you get through." It's the fourth this month about the phones.`, `New review: "⭐ Couldn't get an appointment for my son. The receptionist was kind but there was nothing she could do." It's the third this month, and the third to be nice about reception.`],
 choices:[
  {t:'Reply publicly and explain the new call-back options',fx:{you:-1,rep:1},o:`It's specific and honest. Two people reply that they didn't know about the call-back option.`},
  {t:'Ask happy patients to leave reviews',fx:{team:2,rep:3},o:`Mrs Higgins leaves one. It's 600 words long and mentions the shortbread.`},
  {t:'Never look at reviews again',fx:{you:2,rep:-1},o:`Liberating. The reviews carry on without you.`}
 ]},

{id:'gift',who:'patient',title:'A token of thanks',months:[8],tag:'story',
 text:`A grateful patient leaves a bottle of 18-year-old single malt at reception with a card: "For the doctor who found my cancer early." It's worth about £120.`,
 choices:[
  {t:'Accept it, and record it in the gifts register',fx:{you:4,safety:1},o:`You write it in the register, as the rules require. Then you write the patient a card back. You keep theirs for years.`},
  {t:'Raffle it for the staff Christmas fund',fx:{team:4},o:`Maureen wins. She doesn't drink whisky. She sells it to Alan for £60 and buys the team doughnuts.`}
 ]},

{id:'dna',who:'bev',title:'Did not attend',tag:'story',
 text:`Last month 186 booked appointments weren't attended. That's about 30 GP sessions. Bev has made a poster that says "186 PEOPLE WASTED APPOINTMENTS" in red capitals.`,
 choices:[
  {t:'Automated reminders with an easy cancel link',fx:{demand:-1.5,patients:1},run(){ addMod({id:'sms',label:'Text reminder service',months:99,fx:{cash:-0.15}}); },o:`Missed appointments drop by a third, for about £150 a month. The first batch of reminders goes out at 3am, until Bev finds the setting.`},
  {t:'Put the poster up',fx:{patients:-2,demand:-0.5,rep:-1},o:`The people who read the poster are the people who came. They feel told off.`},
  {t:'Leave it. Most of them had reasons.',fx:{you:1},o:`Fair. Several were stuck in the phone queue trying to cancel.`}
 ]},

{id:'queue_rain',who:'kayleigh',title:'Queue in the rain',months:[7,8,9,10],tag:'story',cond:()=>!S.flags.telephonyLive,
 text:`It's 7:40am and there are 30 people queuing outside in the rain. Someone has brought a camping chair. They came in person because "the phones never answer".`,
 choices:[
  {t:'Open early, hand out tea, triage at the door',fx:{patients:4,team:-3,you:-2,rep:2},o:`The man in the camping chair turns out to have pneumonia. Door triage works. It also takes two receptionists off the phones.`},
  {t:'Keep the doors shut until 8, stick to the system',fx:{patients:-3,team:1,rep:-2},o:`At 8:00 the doors open and 30 damp, frustrated people all ask for "just a quick word".`}
 ]},

{id:'med_student',who:'med',title:'A student for the summer',months:[2,3,4,5],tag:'story',
 text:`The medical school asks if Oliver, a third-year student, can sit in for four weeks. He's keen, polite, and has never seen a patient over 30 who wasn't in a hospital bed.`,
 choices:[
  {t:'Take him. Teaching is why you became a doctor.',fx:{you:2,team:2,cash:0.8,inbox:60},o:`He's brilliant with Mrs Higgins. At the end he says he wants to be a GP. You tell him to think carefully, and to go ahead. Your clinics run slower all month, and the inbox notices.`},
  {t:'Not this year',fx:{you:1},o:`He goes to dermatology. He sends a photo from a conference in Barcelona.`}
 ]},

{id:'training',who:'pcn',title:'Become a training practice?',months:[0,1,2],tag:'story',
 text:`The deanery is desperate for training places. If you become a GP trainer, a registrar arrives in August. You'll need a trainer's course, a room and supervision time. "Trainees often become your next partners," Clare says.`,
 choices:[
  {t:'Sign up. Grow your own GPs.',fx:{you:-4,team:2,flags:{training:1}},run(){ addMod({id:'registrar',label:'GP registrar in post',months:8,at:4,capAdd:70,hours:1.5,fx:{cash:0.7}}); },o:`Trainer's course on Thursday evenings. Dr Ellie Chen joins in August.`},
  {t:'Not this year',fx:{you:1},o:`Maybe next year. You say that every year.`}
 ]},

{id:'reg_crisis',who:'reg',title:'A registrar in the doorway',cond:()=>hasMod('registrar')&&S.month>=5,tag:'story',
 text:`Ellie is in your doorway at 5:50pm. "Sorry. I've got a baby with a temperature and a rash, and I just need to run it past you." The last three times, she was right.`,
 choices:[
  {t:'Go and see the baby with her',fx:{you:-2,safety:3,team:2},o:`It's a viral rash. You go through the traffic-light features together. She'll be a very good GP.`},
  {t:'Talk it through, then trust her judgement',fx:{you:1,safety:1},o:`She's got it right. She wanted to hear it. You tell her. That's supervision.`}
 ]},

{id:'bev_retire',who:'bev',title:'Bev has news',months:[5,6,7,8,9],tag:'story',
 text:`Bev sits down. "I'm 64. My husband wants to buy a caravan. I'm thinking of retiring at Christmas." Bev is the only person who knows the payroll password, the smartcard admin and the alarm code.`,
 choices:[
  {t:'Offer a retention bonus and three days a week (£3,000)',fx:{cash:-3,team:3},o:`She takes it. "Three days. And I'm not doing CQC again." Fair.`},
  {t:'Recruit a new practice manager',fx:{team:-3,you:-2},run(){ addMod({id:'newpm',label:'New practice manager settling in',months:3,aim:{safety:-6,team:-2},hours:1}); },o:`The new manager is sharp and has an MBA. It'll take her three months to find where Bev kept everything.`},
  {t:'Promote Sharon, the deputy',fx:{team:2},alt:{p:0.4,fx:{team:-3},run(){ addMod({id:'sharon',label:'Sharon overwhelmed',months:3,aim:{safety:-5}}); },o:`Sharon is overwhelmed by week two. Bev comes in "just on Tuesdays" to help, unpaid. Somehow it's worse.`},o:`Sharon is brilliant. It turns out she's been doing half of Bev's job for years.`}
 ]},

{id:'maureen_course',who:'maureen',title:'The diabetes course',tag:'story',
 text:`Maureen wants to do an advanced diabetes course: two days a month for three months, paid by the practice. "Then I can start insulin myself. I'm fed up of waiting for you lot."`,
 choices:[
  {t:'Pay for it (£1,200) and cover her sessions',fx:{cash:-1.2,team:3,qof:2},later:[{in:3,p:1,fx:{qof:4,safety:1},note:'Maureen finished her diabetes course. She\'s already started three patients on insulin and cleared the diabetes review backlog.'}],o:`She'll come back with a certificate and a new level of authority, which you didn't think possible.`},
  {t:'Not now, maybe next year',fx:{team:-4},later:[{in:2,p:0.5,fx:{team:-2},note:'Maureen booked the diabetes course herself and applied for study leave. She knows the rules better than you.'}],o:`She takes it well. Suspiciously well.`}
 ]},

{id:'xmas_party',who:'bev',title:'The Christmas do',months:[8],tag:'story',
 text:`Christmas party. Last year's was a curry and a quiz that ended with the nurses and reception not speaking until February. What's the plan?`,
 choices:[
  {t:'Proper night out, practice pays (£2,500)',fx:{team:9,cash:-2.5},o:`Three courses, a DJ and a group photo nobody is allowed to post. Maureen and Kayleigh do the Macarena together. Peace is restored.`},
  {t:'Secret Santa and mince pies',fx:{team:2},o:`You get a mug that says "I survived a partners' meeting". It's accurate.`},
  {t:'Cancelled due to winter pressures',fx:{team:-6,cash:0.5},run(){ addMod({id:'noparty',label:'Still sore about the cancelled party',months:3,aim:{team:-3}}); },o:`Everyone understands. Everyone also remembers.`}
 ]},

{id:'fish',who:'maureen',title:'The microwave incident',tag:'story',
 text:`Somebody has microwaved fish in the staff kitchen. Again. There's an unsigned note on the fridge. There's a counter-note. The counter-note has been annotated.`,
 choices:[
  {t:'Buy a second microwave, for fish only (£90)',fx:{team:3,cash:-0.1},o:`The fish microwave gets its own laminated sign. Best £90 you spend all year.`},
  {t:'Write a kitchen policy',fx:{team:-2,safety:1},o:`Policy KIT-01, version 1.0, ratified at a staff meeting. Ignored by Thursday.`},
  {t:'Stay out of it',fx:{team:-1,you:1},o:`The note war escalates to Post-its on your door. You are Switzerland.`}
 ]},

{id:'cat',who:'cat',title:'A new team member',tag:'story',
 text:`A ginger cat has moved into the car park. Staff have named it QOF. It sleeps on the bonnet of whichever car is warmest. Someone has already bought it a bowl.`,
 choices:[
  {t:'Adopt QOF. Every practice needs a mascot.',fx:{team:6,safety:-2,aim:{team:1}},later:[{in:4,p:0.3,fx:{safety:-3},note:'An infection control audit found cat hair in the treatment room. QOF has been rehomed to the admin office.'}],o:`QOF gets a collar, a bed in the admin office and more social media followers than the practice.`},
  {t:'Call the cat rescue',fx:{team:-4,safety:1},o:`QOF goes to a lovely home. The staff room is quieter. Someone puts up a "missing you" poster.`},
  {t:'Unofficially tolerate QOF',fx:{team:3},alt:{p:0.3,fx:{team:2,safety:-4},o:`The inspection notes include the sentence "a cat was observed in the dispensary".`},o:`QOF is fed "by nobody". Four bowls appear. QOF gets fat.`}
 ]},

{id:'wfh',who:'bev',title:'Working from home',tag:'story',
 text:`The admin team asks to work from home two days a week. "We code letters and summarise records. We could do it in our pyjamas." The ICB's IT team say remote access is possible, in the sense that anything is possible.`,
 choices:[
  {t:'Yes. Laptops and smartcard readers (£1,500)',fx:{team:5,cash:-1.5,inbox:-40,aim:{team:2}},later:[{in:3,p:0.25,fx:{safety:-3,cash:-3,icb:-2},note:'A laptop with patient letters on it was left on a train. It was encrypted, but it\'s still a reportable data breach and a long week.'}],o:`Productivity goes up. Nobody's sure why. Everyone suspects the quieter kitchen.`},
  {t:'No. We need people in the building.',fx:{team:-4},later:[{in:2,p:0.45,fx:{admin:4,team:-2},note:'An admin coder left for an NHS job with hybrid working. Letters are now piling up faster.'}],o:`They accept it. Two start looking at jobs that offer hybrid working.`}
 ]},

{id:'noro',who:'maureen',title:'Norovirus',months:[7,8,9,10],tag:'story',
 text:`Norovirus is working its way through the staff. Four people are off. Maureen is in, but green. She insists she's fine, then leaves the room at speed.`,
 choices:[
  {t:'Send everyone with symptoms home for 48 hours',fx:{safety:3,team:2},run(){ addMod({id:'noro',label:'Norovirus: staff off sick',months:1,capMul:0.9}); },o:`Capacity drops for the month. The outbreak stops with your staff, not your patients.`},
  {t:'Soldier on, it\'s winter',fx:{team:-4,safety:-4},alt:{p:0.4,fx:{team:-6,safety:-6,patients:-3},run(){ addMod({id:'noro2',label:'Norovirus outbreak',months:1,capMul:0.8}); },o:`It spreads to three patients and the care home. The outbreak team becomes your pen pal.`},o:`You get away with it. Nobody feels good about it.`}
 ]},

{id:'whatsapp',who:'kayleigh',title:'WhatsApp',tag:'story',
 text:`There's a row in the staff WhatsApp group. It started with who restocks the printer paper. It's now about "respect" and "some people". It has 214 messages. You're in the group.`,
 choices:[
  {t:'Get the two sides in a room with biscuits',fx:{team:5,you:-2},o:`It turns out nobody knew whose job the printer was. Now Sharon knows. It's Sharon.`},
  {t:'Mute the group. Forever.',fx:{you:3,team:-2},o:`Blissful silence. You miss the message about the fire drill.`}
 ]},

{id:'pcn_arrs',who:'pcn',title:'Free staff!',cond:()=>arrsLeft()>=arrsClaimOf('mhp'),tag:'real',src:['S4','S84'],
 info:'Each PCN gets an additional-roles budget of £27.668 per weighted patient a year and is reimbursed for each role up to a maximum. The practice gets the clinician, but has to provide a room, induction and clinical supervision.',
 text:`Clare from the PCN has unspent additional-roles budget. "Would you like a mental health practitioner? Fully funded. They start next month." The PCN pays. The question is where they'll sit.`,
 choices:[
  {t:'Yes, find them a room',fx:{staff:{mhp:1},patients:2},o:`Patients who need longer than ten minutes will finally get it. You need to find a room, and an hour a week to supervise.`},
  {t:'No room at the inn',fx:{you:1},o:`The funding goes to the practice across town, which has a portakabin.`}
 ]},

{id:'rooms',who:'bev',title:'Room for everyone?',cond:()=>roomsNeeded()>roomsAvail(),tag:'real',src:['S31'],
 info:'In a 2025 BMA survey, only half of practices said their premises were suitable for present needs and 83% said they couldn\'t meet future demand. 42% of bids for improvement funding since 2022 were rejected.',
 text:`Every consulting room is double booked on Tuesdays. The physio is working in the baby-changing room. "We need more space," Bev says, "or fewer people. And we need the people."`,
 choices:[
  {t:'Convert the staff room into a clinic room',fx:{rooms:1,team:-5,aim:{team:-2}},o:`The staff room is now a clinic room. Lunch is eaten in the corridor. Morale takes it personally.`},
  {t:'Turn the meeting room into a clinic room (£4,000)',need:()=>!S.flags.proj_meetingroom,why:'You\'ve already converted it',fx:{rooms:1,cash:-4,team:-2,flags:{proj_meetingroom:1}},o:`A sink, a couch, wipe-clean flooring and a blind. Practice meetings now happen in the staff room, standing up, which makes them shorter.`},
  {t:'Hire a portakabin for the car park (£14,000)',fx:{rooms:2,cash:-14},o:`It arrives on a lorry. It has air conditioning and a ramp. It's the nicest room in the building.`},
  {t:'Bid for improvement funding (£3,000 for the architect)',fx:{cash:-3},run(){ const ok=chance(0.45+(S.icb-55)/150); plant({in:5,fx:ok?{rooms:2,team:5}:{team:-2},note:ok?'The premises improvement bid was approved. Two new consulting rooms by spring.':'The premises improvement bid was rejected: "insufficient strategic priority".'}); },o:`The architect draws two extra rooms. The decision will take about five months, and the ICB's opinion of you matters.`}
 ]},

{id:'pcn_meeting',who:'pcn',title:'Neighbourhood transformation',tag:'story',
 text:[`The PCN board meets Tuesday 1-5pm: "Integrated Neighbourhood Teams: a transformation journey." There will be sticky notes. Your attendance is "strongly encouraged".`, `The PCN board meets Thursday 1-5pm: "Neighbourhood health: from vision to delivery, part 3." Parts 1 and 2 were never circulated. Your attendance is "strongly encouraged".`],
 choices:[
  {t:'Go. Someone has to represent the practice.',fx:{you:-3,cash:0.6,team:1,icb:2},o:`Four hours of sticky notes. You secure a share of the new frailty funding and eat a surprising number of free biscuits.`},
  {t:'Send Bev',fx:{team:-1},o:`Bev comes back with a new acronym and a quiet fury.`},
  {t:'Skip it',fx:{you:2},alt:{p:0.4,fx:{you:1,cash:-1,icb:-2},o:`The PCN divides the new money between the practices that turned up.`},o:`Nothing happens. It often doesn't.`}
 ]},

{id:'pcn_cd',who:'pcn',title:'A promotion?',months:[2,3,4,5,6],tag:'story',
 text:`Clare is stepping down as PCN Clinical Director. "You'd be great," she says. "It pays for two sessions a week, and you get a lanyard." There are eleven practices in the PCN, and each one has opinions.`,
 choices:[
  {t:'Accept the role',fx:{team:1,icb:4},run(){ addMod({id:'cd',label:'PCN Clinical Director',months:99,hours:4,fx:{cash:1.3}}); },o:`You're now responsible for eleven practices' opinions. The money helps. The four extra hours a week don't.`},
  {t:'Decline',fx:{you:2},o:`Someone else gets the lanyard. You sleep well.`}
 ]},

{id:'collective',who:'lmc',title:'Safe working',months:[1,2,3,4,5,6,7],tag:'real',src:['S25','S38'],
 info:'The BMA\'s safe working guidance suggests 25 patient contacts per GP per day. The BMA says it protects patients from unsafe care; critics, including ministers, say it reduces access. GPs rejected the 2026/27 contract changes by 98.9% in a BMA referendum.',
 text:`The LMC is urging practices to adopt safe working: a cap of 25 patient contacts per GP per day, with overflow to local hubs. "It's about safety," Steve says. "Also sanity."`,
 choices:[
  {t:'Implement the safe working cap',fx:{patients:-3,icb:-4},run(){ addMod({id:'safe',label:'Safe working cap',months:99,capMul:0.94,aim:{you:6,team:2,safety:3}}); },o:`Lists stop at 25. The overflow goes to the hub, which is full by 10am. But you leave by 7pm for the first time since you qualified.`},
  {t:'Carry on as normal',fx:{you:-1},o:`You keep going. So does the queue.`}
 ]},

{id:'appraisal',who:'you',title:'Appraisal season',tag:'story',
 text:[`Your appraisal is due. You need a year of learning reflections, a quality improvement activity, patient feedback and a significant event reflection. You have one reflection, written in 2024. It's about burnout.`, `Appraisal again. You need a year of reflections, a quality improvement project and patient feedback. So far you have a certificate from a webinar you mostly listened to while driving.`],
 choices:[
  {t:'Spend the weekend on the portfolio',fx:{you:-4,safety:2},o:`Your appraiser praises your "rich reflective practice". You reflect on how much you'd like your weekend back.`},
  {t:'Ask to defer it three months',fx:{you:2},later:[{in:3,p:1,fx:{you:-5},note:'Your deferred appraisal arrived, on top of everything else. You wrote reflections until 1am.'}],o:`Deferred. It'll be back.`}
 ]},

{id:'nativity',who:'home',title:'The nativity',months:[8],tag:'story',
 text:`It's the school nativity at 2pm on Thursday. Your child is playing Third Sheep, and has been practising their "baa" for a week. You have a 14-patient afternoon list.`,
 choices:[
  {t:'Cancel the afternoon. You\'re going.',fx:{you:9,patients:-2,team:-1},o:`Third Sheep's "baa" is magnificent. You film all of it, and watch it again at 11pm while doing the results.`},
  {t:'Ask a partner to cover',need:()=>activeOthers()>0,why:'There\'s nobody left to ask',fx:{you:6,team:-2},o:`They cover. You owe them, and you'll be paying that back in February.`},
  {t:'Stay. Someone has to see the patients.',fx:{you:-9},o:`You get a video at 2:47pm and watch it between patients 9 and 10. It's the only good part of the day.`}
 ]},

{id:'lunch',who:'you',title:'Lunch',tag:'real',src:['S36'],
 info:'Partners on seven or eight sessions report working about 46 hours a week. A nominal 4h10m session takes about six real hours once the admin is done.',
 text:`You realise you haven't eaten lunch since Tuesday. Today's lunch so far is a Rich Tea biscuit and half a banana a patient's child gave you.`,
 choices:[
  {t:'Block 30 minutes every day. Protected.',fx:{you:5},run(){ addMod({id:'lunch',label:'Protected lunch break',months:99,capMul:0.985,aim:{you:3}}); },o:`It feels radical. It shouldn't. You eat a sandwich sitting down and nearly cry.`},
  {t:'Keep going. Lunch is for the weak.',fx:{you:-4,patients:1},o:`You finish the day on four coffees and the other half of the banana.`}
 ]},

{id:'dinner',who:'home',title:'"Home for dinner?"',tag:'story',
 text:`"Will you be home for dinner this week?" The question is gentle. The subtext isn't. You worked until 8:40pm every night last week.`,
 choices:[
  {t:'Promise Wednesday. Mean it.',fx:{you:5},alt:{p:0.35,fx:{you:-5},o:`At 6:15pm on Wednesday a patient collapses in the waiting room. You get home at 9. Dinner is in the oven, under foil, with a note.`},o:`You're home at 6:30. There's pasta, and nobody talks about the practice for three whole hours.`},
  {t:'"After QOF year end. I promise."',fx:{you:-4},o:`It's not the first time you've said it. You notice they don't reply.`}
 ]},

{id:'gmc',who:'you',title:'A letter from the GMC',w:0.5,tag:'real',src:['S40'],
 info:'The state-backed indemnity scheme covers NHS clinical negligence claims, but not GMC investigations, inquests or complaints. For those, GPs rely on a medical defence organisation.',
 text:`A brown envelope. The GMC has received a complaint about you and is "assessing whether it requires investigation". Your stomach falls through the floor.`,
 choices:[
  {t:'Ring your medical defence organisation',fx:{you:-6},run(){ schedule('gmc_closed',2); },o:`The adviser is calm. "We see these all the time. Send me your notes." It helps, a bit.`},
  {t:'Deal with it yourself',fx:{you:-10},alt:{p:0.5,fx:{you:-12,safety:-2},o:`You write a long, defensive response at 2am. Your defence organisation later calls it "a learning opportunity".`},run(){ schedule('gmc_closed',2); },o:`You draft a careful, factual response. Four drafts. No sleep.`}
 ]},

{id:'gmc_closed',arc:1,who:'you',title:'Case closed',tag:'story',
 text:`The GMC writes: "no further action". The complaint didn't meet the threshold for investigation. It took eleven weeks. You'll remember them for considerably longer.`,
 choices:[{t:'Breathe',fx:{you:8},o:`You go for a walk at lunchtime, the first in months. The sky is enormous.`}]}
);
/* ===================== EVENTS 3: money, safety, systems ===================== */
EVENTS.push(
{id:'fridge',who:'maureen',title:'The vaccine fridge',tag:'rule',
 info:'Vaccines must be stored between 2°C and 8°C. After a cold-chain breach the stock is quarantined and the manufacturers are asked whether it\'s still usable. Using compromised vaccines can mean recalling patients to be revaccinated.',
 text:`Monday morning. The vaccine fridge data logger shows it reached 11°C for about six hours over the weekend. Inside: £7,000 of vaccines. Maureen is holding the logger like it's a murder weapon.`,
 choices:[
  {t:'Quarantine the stock and ask the manufacturers for stability advice',fx:{you:-3,safety:4,cash:-2.5,team:-1,inbox:20,aim:{safety:1}},later:[{in:1,p:0.35,fx:{cash:-3,patients:-2},note:'The manufacturers came back on the rest of the fridge stock: not usable after all. Another batch binned, and 60 flu appointments rebooked.'}],o:`About two thirds is fine according to the manufacturers' data. The rest is binned. You write it up as a significant event and fit a second alarm. The system works.`},
  {t:'Bin the lot, to be safe',fx:{cash:-7,safety:3},o:`£7,000 into the pharmaceutical waste bin. Safe, expensive and, it turns out, partly unnecessary.`},
  {t:'"They\'re probably fine."',fx:{safety:-4},later:[{in:4,p:0.4,fx:{safety:-14,cash:-7,patients:-5,rep:-6},note:'Because the vaccines from the broken fridge were used: an audit found the breach. 140 patients need recalling for revaccination, and the paper found out.'}],o:`Nobody says anything. You think about it every night at about 3am.`}
 ]},

{id:'sea_referral',who:'bev',title:'A significant event',tag:'real',src:['S40'],
 info:'Professional duty of candour means telling a patient when something has gone wrong with their care, apologising and explaining. Negligence claims are covered by the state scheme; complaints and GMC matters are not.',
 text:`A suspected cancer referral you made three weeks ago was never sent. It was sitting in a drafts folder. The patient, 58, with a breast lump, has rung to ask why she hasn't heard anything.`,
 choices:[
  {t:'Ring her yourself, apologise, fix it, and run a full review',fx:{safety:6,you:-4,patients:1,aim:{safety:1}},o:`You apologise properly. The referral goes today, with a call to the breast unit. The review finds the process gap. You fix it. That's how it's meant to work.`},
  {t:'Send it now and fix it quietly',fx:{safety:-3},later:[{in:2,p:0.4,fx:{safety:-8,patients:-4,you:-6,rep:-4},note:'The patient whose referral sat in the drafts folder has complained. She asks why nobody told her what went wrong. It\'s a fair question.'}],o:`The referral goes. The drafts folder is still there.`}
 ]},

{id:'wrong_letter',who:'bev',title:'Wrong address',tag:'story',
 text:`A hospital letter about Mrs A was scanned into Mrs B's record, then posted to Mrs B. Mrs B rings, kindly, to say she has a letter that isn't hers. The scanning software is 97% accurate. Today was the other 3%.`,
 choices:[
  {t:'Log it as a data breach and apologise to both',fx:{safety:4,you:-2},o:`You assess it against the reporting criteria, record it properly and apologise to both patients. Both are gracious about it, which is more than the scanning software deserves.`},
  {t:'Apologise and move on',fx:{you:1},later:[{in:2,p:0.35,fx:{safety:-8,rep:-3,cash:-5},note:'Mrs A complained to the Information Commissioner about the misfiled letter. The legal advice cost £5,000.'}],o:`It blows over. Probably.`}
 ]},

{id:'methotrexate',who:'raj',title:'Nine months without bloods',tag:'story',
 text:`Raj has found a patient on methotrexate who hasn't had a blood test in nine months. The repeats have gone out every month without anyone noticing. Raj thinks there are more.`,
 choices:[
  {t:'Run a full high-risk drug monitoring audit',need:()=>S.staff.pharm>0,why:'You need a clinical pharmacist',fx:{safety:6,inbox:40,team:-1,you:-2,aim:{safety:2}},o:`Raj finds 31 patients overdue monitoring. Two had significant results. The audit may have saved a life, and now it runs every quarter.`},
  {t:'Block repeats until bloods are done',fx:{safety:3,patients:-3},o:`Thirty-one patients get a text asking them to book a blood test before their next prescription. Twenty-nine do.`},
  {t:'Book this one patient and carry on',fx:{safety:-4},later:[{in:3,p:0.4,fx:{safety:-8,you:-4},note:'Another patient on a high-risk drug with no monitoring was admitted with a low white cell count.'}],o:`He's fine. You don't know about the others yet.`}
 ]},

{id:'defib',who:'maureen',title:'Emergency equipment',tag:'story',
 text:`Maureen has checked the emergency trolley. The defibrillator pads expired in 2022. The oxygen cylinder is a quarter full. There's a mysterious sandwich in the bottom drawer.`,
 choices:[
  {t:'Replace everything and set up weekly checks (£400)',fx:{cash:-0.4,safety:5,team:1,aim:{safety:1}},o:`New pads, new cylinder, new checklist. The sandwich gets a respectful burial.`},
  {t:'Replace the pads only',fx:{cash:-0.1,safety:1},o:`Better than nothing. Just.`}
 ]},

{id:'legionella',who:'bev',title:'Legionella',tag:'story',
 text:`The legionella risk assessment is two years overdue. Bev only knows because it's on the CQC checklist she downloaded "for fun".`,
 choices:[
  {t:'Book the assessment (£650)',fx:{cash:-0.65,safety:3},o:`A man in overalls runs every tap for two minutes and writes a 30-page report. Water: fine. Showerhead in the staff toilet: condemned.`},
  {t:'Run the taps a bit more',fx:{safety:-2},later:[{in:3,p:0.3,fx:{cash:-4,safety:-4},note:'A routine water test found legionella in the staff shower. Remedial works cost £4,000.'}],o:`It'll almost certainly be fine.`}
 ]},

{id:'cyber',who:'hospital',title:'Pathology down',tag:'story',
 text:`The hospital's pathology IT supplier has been hit by a cyberattack. For the next six weeks, only urgent blood tests will be processed. Routine monitoring and QOF bloods are off.`,
 choices:[
  {t:'Triage every request by risk',fx:{you:-3,safety:2},run(){ addMod({id:'cyber',label:'Pathology outage',months:2,hours:2,fx:{qof:-2}}); },o:`Every blood form now needs a GP to decide if it's urgent. You make 300 small decisions a week. Nothing falls through.`},
  {t:'Send everyone to the hospital walk-in',fx:{patients:-4,team:1,icb:-2},run(){ addMod({id:'cyber',label:'Pathology outage',months:2,fx:{qof:-2}}); },o:`The hospital walk-in queue goes out of the door. The hospital writes a stern letter about "inappropriate GP redirection".`}
 ]},

{id:'it_outage',who:'it',title:'System down',rep:1,max:2,w:()=>S.counts.it_outage?0.6:1,tag:'real',src:['S60','S61'],
 info:'In July 2024 a faulty security update took down Windows machines worldwide, and with them the clinical system many GP practices use to book appointments, read notes and send prescriptions. Practices went back to paper records and handwritten prescriptions, without access to test results. With the Electronic Prescription Service down, prescriptions go on paper FP10 forms, and pharmacies can\'t download them. Business continuity plans usually include a printed or offline summary of each day\'s patients.',
 text:()=>`08:04 Monday. The clinical system is down across the area. No appointment book, no past medical history, no allergies, no repeat lists, no results, and no electronic prescriptions. The supplier says "sometime today". ${S.flags.bcp ? 'At least last night\'s offline summary printed: problems, medicines and allergies for everyone booked today.' : 'Nobody printed anything last night, because nobody ever has.'} The waiting room is filling up.`,
 choices:[
  {t:'Paper day: handwritten notes, handwritten FP10s, scan it all in later',
   fx:()=>S.flags.bcp?{team:3,you:-2,inbox:60,safety:-1}:{team:3,you:-3,inbox:90,safety:-4},
   run(){ addMod({id:'paperday',label:'Catching up after the system outage',months:1,capMul:0.9,hours:2}); },
   later:[{in:1,p:0.25,fx:{safety:-3,you:-2},note:'Because the paper day ran without records: a handwritten prescription clashed with a medicine nobody could see on the repeat list. The pharmacist caught it and rang you.'}],
   o:()=>S.flags.bcp?`Everyone works from the printed summary. Every consultation still starts with "and what tablets are you on?", but the allergies are on paper in front of you. Prescriptions go on FP10 pads, signed in ink. Then there's the scanning.`:`Kayleigh rebuilds the morning list from the phone log and memory. Every consultation starts with "and what tablets are you on?" One patient mentions, just in time, that she's allergic to penicillin. Prescriptions go on FP10 pads, and the pharmacy across the road rings about your handwriting. Then there's the scanning.`},
  {t:'Urgent only today. Rebook everyone else.',fx:{patients:-5,you:1,safety:1},run(){ addMod({id:'rebook',label:'Rebooking after the outage',months:1,demand:4}); },o:`It comes back at 1:40pm. You spend the afternoon rebooking the morning, and next month is busier for it.`},
  {t:'Get through today, then buy a proper continuity kit (£1,200)',need:()=>!S.flags.bcp,why:'You already have one',fx:{team:1,you:-2,inbox:70,safety:-2,cash:-1.2,flags:{bcp:1},aim:{safety:1}},o:`Paper today. From tomorrow the system prints an overnight summary of each day's patients, there's a 4G backup router, and the FP10 pads live in a labelled drawer. Next time will still be bad, but not blind.`}
 ]},

{id:'windows_update',who:'it',title:'Working on updates',rep:1,max:2,tag:'real',src:['S62'],
 info:'Under NHS England\'s GP IT operating model, ICBs commission and run most practices\' IT, including patching and operating system updates, which are part of the cyber security rules. When updates land at the wrong time, the first session of the day starts without computers or smartcards.',
 text:`08:00. Every PC in the building says "Working on updates 12%. Don't turn off your computer." The ICB's IT provider pushed Windows updates overnight. Your first patient is booked for 8:10. When the PCs come back, the smartcard readers will want a restart too.`,
 choices:[
  {t:'Start on the phones, with notes on paper, until they\'re back',fx:{patients:-1,team:-2,you:-2,inbox:15},o:`Half an hour of phone consultations written on the back of old letters. At 8:37 the computers come back, then ask for another restart.`},
  {t:'Ring the IT helpdesk',fx:{you:-2,patients:-2},o:`Ticket #448214 is logged at 8:06. It's resolved at 8:41, when the update finishes by itself. Your morning clinic finishes at 1:15.`},
  {t:'Ask the ICB to schedule updates overnight, with notice',fx:{you:-1,icb:1},later:[{in:2,p:0.6,fx:{team:2,you:1},note:'The ICB\'s IT provider moved practice updates to 2am, with a week\'s notice. Mornings start on time again.'}],o:`A polite email, copied to the LMC. The reply says your "feedback has been logged". Two months later, surprisingly, something changes.`}
 ]},

{id:'med_shortage',who:'chemist',title:'Out of stock',rep:1,max:2,tag:'real',src:['S63','S64','S65'],
 info:'When a medicine is in short supply, the Department of Health and Social Care issues a Medicine Supply Notification with advice on alternatives. Every switch then needs a new prescription. For serious shortages it can issue a Serious Shortage Protocol, which lets pharmacists supply a set alternative, a reduced quantity or a different form without going back to the GP. Recent shortages have included HRT, ADHD medicines, some diabetes medicines and antibiotics, mostly because of manufacturing problems.',
 text:()=>{ const opts=[['An HRT patch',0.009],['A common ADHD medicine',0.004],['A widely used diabetes medicine',0.012],['A first-line antibiotic',0.003],['A common epilepsy medicine',0.003]]; if(S.flags.shortDrug==null) S.flags.shortDrug=Math.floor(Math.random()*opts.length); const [d,rate]=opts[S.flags.shortDrug]; return `Ashok rings. "${d} is out of stock everywhere. The wholesalers say eight weeks, maybe twelve." About ${Math.max(12,Math.round(S.list*rate))} of your patients take it. There's a Medicine Supply Notification listing alternatives, but there's no Serious Shortage Protocol, so every switch needs a new prescription from you.`; },
 after(){ delete S.flags.shortDrug; },
 choices:[
  {t:'Raj reviews every patient and switches them one by one',need:()=>S.staff.pharm>0,why:'You need a clinical pharmacist',fx:{inbox:35,safety:3,patients:1,you:-1,qof:-2},o:`Raj works through the list: the right alternative for each patient, their other medicines checked, and a text explaining the change. Nobody goes without, but his QOF medication reviews wait a month.`},
  {t:'Switch everyone to the first listed alternative in one batch',fx:{inbox:15,patients:-1,safety:-1},later:[{in:1,p:0.45,fx:{inbox:30,patients:-2,safety:-2},note:'Because of the batch switch: thirty patients rang about tablets that look different, and two had side effects from the alternative.'}],o:`One search, one batch of prescriptions, one text message. It's done by lunchtime. Mostly.`},
  {t:'Tell patients to try other pharmacies',fx:{patients:-4,rep:-2,inbox:10},later:[{in:1,p:0.5,fx:{safety:-4,you:-2},note:'Because patients were sent pharmacy to pharmacy: one went three weeks without their medicine and ended up in A&E.'}],o:`Reception gives out a list of pharmacies. Patients ring round, then ring you back.`}
 ]},

{id:'phones',who:'kayleigh',title:'The phones have died',cond:()=>!S.flags.telephony,tag:'story',
 text:`08:00:14. The phone system has crashed. It was installed in 2008, and the engineer who understood it has retired to Spain. People are ringing 111 to ask why the surgery isn't answering.`,
 choices:[
  {t:'Commit to a cloud telephony upgrade',fx:{you:-1,flags:{telephony:1}},o:`You sign the contract. Going live is now a project you can choose: queue positions, call-backs and data you can actually use.`},
  {t:'Get it patched up (£900)',fx:{cash:-0.9,patients:-2},later:[{in:3,p:0.6,fx:{patients:-4,rep:-3},note:'The patched-up phone system crashed again at 8am on a Monday.'}],o:`It's working by 10am.`}
 ]},

{id:'roof',who:'bev',title:'Drip',tag:'story',
 text:[`There's water coming through the ceiling of Room 3. It's landing, with some precision, on the examination couch. The flat roof has been "fine for years".`, `The leak in Room 3 is back, in a new place. It's dripping on the computer this time. The roofer who "sorted it" last year has stopped answering his phone.`],
 choices:[
  {t:'Emergency roofer, today',fx:(()=>S.flags.soldBuilding?{team:1}:{cash:-6,team:1}),o:()=>S.flags.soldBuilding?`It's the landlord's problem now. The roofer arrives in three days. You rediscover the upside of renting.`:`£6,000. The roofer sucks air through his teeth for a full minute before quoting.`},
  {t:'Buckets and a cone',fx:{safety:-3},run(){ addMod({id:'roof',label:'Room 3 out of action',months:2,rooms:-1}); },later:[{in:2,p:0.5,fx:{cash:-9},note:'The leak you patched with buckets spread into the ceiling void. The repair now costs £9,000.'}],o:`Room 3 becomes a storage room with a bucket. You lose a room for two months.`}
 ]},

{id:'service_charge',who:'landlord',title:'An invoice',cond:()=>!S.flags.soldBuilding,tag:'story',
 text:`An invoice arrives for "backdated service charges, 2019 to 2025": £38,412.66. It includes cleaning you've always paid for yourselves, and £4,000 for a lift. The building has one storey.`,
 choices:[
  {t:'Dispute it with LMC support',fx:{cash:-1.5,you:-2},later:[{in:3,p:0.3,fx:{cash:-10.5,you:-2},note:'After months of letters you settled the service-charge dispute for £10,500. There is still no lift.'}],o:`Months of correspondence begin. The invoice is "on hold". For a GP practice, that counts as victory.`},
  {t:'Pay in instalments to make it go away',fx:{you:1},run(){ addMod({id:'svc',label:'Service charge instalments',months:6,fx:{cash:-4}}); },o:`£4,000 a month for six months. It goes away. So does a meaningful slice of the partners' profit.`},
  {t:'Ignore it',fx:{you:1},later:[{in:3,p:0.5,fx:{you:-6,cash:-20},note:'The ignored service-charge invoice went to a debt recovery agency. You paid £20,000 in a hurry and disputed the rest.'}],o:`Nothing happens. For now.`}
 ]},

{id:'boiler',who:'bev',title:'Cold',months:[7,8,9,10],tag:'story',
 text:`The boiler has died. It's 11°C in the waiting room. Mrs Higgins is wearing two coats and has brought a flask. The plumber can do Thursday, "maybe".`,
 choices:[
  {t:'New boiler (£6,500)',fx:(()=>S.flags.soldBuilding?{cash:-1}:{cash:-6.5}),o:()=>S.flags.soldBuilding?`The landlord pays for the boiler, grumbling. You pay for the call-out.`:`The new boiler is A-rated. The invoice is not.`},
  {t:'Portable heaters until spring',fx:{team:-4,patients:-2,safety:-2,cash:-0.4},run(){ addMod({id:'cold',label:'Cold building',months:2,aim:{team:-3}}); },o:`Six fan heaters and a tangle of extension leads. The fire risk assessment weeps quietly.`}
 ]},

{id:'photocopier',who:'rep',title:'A print solution',tag:'story',
 text:`A sales rep offers a "managed print solution": a photocopier on a seven-year lease at £610 a month. "It scans directly to the cloud." You currently scan to a PC called RECEPTION-OLD-2.`,
 choices:[
  {t:'Sign',fx:{team:2,inbox:-20},run(){ addMod({id:'printer',label:'Photocopier lease',months:99,fx:{cash:-0.61}}); },o:`It staples. It hole-punches. It will outlive you, contractually.`},
  {t:'Decline and buy a £300 scanner',fx:{cash:-0.3},o:`RECEPTION-OLD-2 gets a friend. It's fine.`}
 ]},

{id:'rep_lunch',who:'rep',title:'Lunch and learn',tag:'story',
 text:[`Chad would love to buy lunch for Wednesday's clinical meeting and "share some exciting data" on a new inhaler. The sandwiches are from the good deli. The data is from the good marketing department.`, `Chad is back. This time it's a "breakfast briefing" on a new weight-loss injection, with croissants from the good bakery. The slides have more graphs than axes.`],
 choices:[
  {t:'Accept, and critique the data afterwards',fx:{team:3,you:1},o:`The sandwiches are excellent. Raj takes the trial apart slide by slide. Chad takes notes. Everyone learns something.`},
  {t:'Decline. You follow the local formulary.',fx:{team:-1,safety:1},o:`Principled. Hungry.`}
 ]},

{id:'locum_offer',who:'agency',title:'A locum is available',tag:'real',src:['S28'],
 info:'Typical in-hours GP locum rates are £85 to £105 an hour, and agencies keep 15 to 25% of what you pay. Locums are paid by the session and aren\'t expected to deal with results or letters.',
 text:`The agency has a GP free for two weeks from tomorrow: £110 an hour, sessions only, "no home visits, no results, no letters". The wait for a routine appointment is three weeks.`,
 choices:[
  {t:'Book them (about £4,600)',fx:{cash:-4.6,patients:2},run(){ addMod({id:'locum2',label:'Agency locum in post',months:1,capAdd:60,fx:{inbox:30}}); },o:`An excellent clinician who leaves at 6pm sharp every day, and leaves 30 unactioned results in your inbox.`},
  {t:'No thanks',fx:{you:-1},o:`You look at the three-week wait. It looks back.`}
 ]},

{id:'research',who:'pcn',title:'Research practice?',tag:'story',
 text:`The regional research network would like the practice to recruit patients to national studies. They'll fund a research nurse for a day a week and pay per patient recruited.`,
 choices:[
  {t:'Sign up',fx:{team:3,you:-1,rep:2},run(){ addMod({id:'research',label:'Research network income',months:99,fx:{cash:0.6}}); },o:`Maureen does the training and becomes quietly evangelical. The practice logo appears on a slide at a national conference.`},
  {t:'Not now',fx:{you:1},o:`Maybe once the building stops leaking.`}
 ]},

{id:'icb_plan',who:'icb',title:'An access improvement plan',tag:'story',
 text:[`Jonathan from the ICB needs your "access improvement plan" by Friday. There's a 14-page template. Completing it unlocks a payment. Not completing it "will be noted".`, `Jonathan from the ICB needs your "winter resilience plan" by Friday. There's a 16-page template, and last year's is in a folder called FINAL_v7_actualFINAL. Completing it unlocks a payment. Not completing it "will be noted".`],
 choices:[
  {t:'Write it (Friday night)',fx:{you:-3,cash:4.5,icb:4},o:`You write "we will continue to improve access" in eleven different ways. The payment arrives two months later.`},
  {t:'Bev adapts last year\'s',fx:{team:-2,cash:4.5},alt:{p:0.3,fx:{team:-2,icb:-4},o:`Bev's version still mentions Dr Hartley and a phone system you replaced. The ICB notices.`},o:`It's accepted without comment.`},
  {t:'Don\'t bother',fx:{you:1,icb:-5},o:`It is noted.`}
 ]},

{id:'inhaler_switch',who:'icb',title:'A prescribing incentive',tag:'story',
 text:`The ICB will pay you to switch 400 patients from metered-dose to dry-powder inhalers: greener, cheaper and a lot of letters. "It's a quick win," says Jonathan, who has never done an inhaler review.`,
 choices:[
  {t:'Do it properly, with technique checks',fx:{you:-2,cash:3,qof:2,inbox:30,icb:3},o:`Raj and Maureen check technique for 400 patients. Twelve discover they've never used their inhalers properly.`},
  {t:'Bulk switch by letter',fx:{cash:3,patients:-3,safety:-2},later:[{in:1,p:0.5,fx:{patients:-2,inbox:40},note:'The bulk inhaler switch generated 40 calls from patients who didn\'t know how to use the new device.'}],o:`The letters go out.`},
  {t:'Decline',fx:{icb:-2},o:`The inhalers stay the same. So does the funding.`}
 ]},

{id:'measles',who:'maureen',title:'Measles',months:[3,4,5,6,7,8,9],tag:'story',
 text:`There's measles at the primary school on Mill Lane: four confirmed cases. Your MMR uptake at age five is 81%. Maureen has pulled up the list of unvaccinated children. It's long.`,
 choices:[
  {t:'Catch-up clinics every evening this week',fx:{team:-3,you:-2,safety:3,qof:2,cash:1.5,rep:2},o:`Maureen vaccinates 94 children. Several parents say nobody had ever followed up the missed appointment. Now somebody has.`},
  {t:'Send letters and carry on',fx:{safety:-2,patients:-1},o:`Nine families book in. The outbreak team calls to ask what else you're doing.`}
 ]},

{id:'heatwave',who:'bev',title:'Heatwave',months:[2,3,4],tag:'story',
 text:`It's 33°C. The server cupboard is 41°C and making a noise like a hairdryer. The waiting room fan is moving hot air from one side of the room to the other.`,
 choices:[
  {t:'Buy portable air conditioning (£800)',fx:{cash:-0.8,team:3},o:`The server stops wheezing. So does Maureen.`},
  {t:'Prop the doors and windows open',fx:{safety:-2,team:-1},o:`A pigeon gets into Room 5 during a diabetes review and settles on the sharps bin. It takes two nurses and a towel to persuade it out.`}
 ]},

{id:'pharmacy_close',who:'chemist',title:'The pharmacy on the high street',tag:'story',
 text:`Ashok rings. The chain pharmacy on the high street is closing next month. That's 4,000 prescriptions a month looking for somewhere to go, and a lot of Pharmacy First consultations coming back to you.`,
 choices:[
  {t:'Work with Ashok on a plan',fx:{you:-2,patients:1,demand:1},o:`Ashok takes on extra staff and a delivery van. It's still busier, but it's organised.`},
  {t:'Nothing you can do',fx:{demand:2.5,patients:-2},o:`Demand at the surgery goes up. So do complaints about "the chemist".`}
 ]},

{id:'enhanced_access',who:'pcn',title:'Saturday sessions',tag:'real',src:['S4'],
 info:'PCNs must provide enhanced access: 60 minutes of appointments per 1,000 patients a week, in the evenings and on Saturdays. GPs who staff it are paid by the session.',
 text:`The PCN needs cover for Saturday enhanced-access clinics for three months. It pays well. Saturday mornings used to be for parkrun and being a person.`,
 choices:[
  {t:'Take them',fx:{you:-2},run(){ addMod({id:'ea',label:'Saturday enhanced access',months:3,capAdd:30,hours:4,fx:{cash:1.2}}); },o:`You do Saturdays. The patients are people who can't come in the week, and they're wonderfully grateful.`},
  {t:'Decline',fx:{you:1},o:`Parkrun. Personal best. Worth it.`}
 ]},

{id:'accountant',who:'accountant',title:'Quarterly figures',months:[3,6,9],tag:'real',src:['S23'],
 info:'Drawings are payments on account of expected profit. If they run ahead of profit, partners have to pay money back in at year end. Accountants often advise new partners to put about 40% of drawings aside for tax.',
 text:()=> S.cash<S.overdraft/2 ? `Neville looks over his glasses. "Your drawings are running ahead of profit. At this rate you'll be paying money back in at year end, personally. And put 40% aside for tax. Your first bill will be a big one."` : `Neville looks over his glasses. "It's healthier than most. Your staff costs are rising faster than your income, like everyone's. And put 40% of your drawings aside for tax."`,
 choices:[
  {t:'Cut partners\' drawings to lean for now',fx:{you:-2,okoye:6},run(){ S.plan.draw='low'; },o:`Drawings drop to lean from this month. The overdraft breathes out. Your mortgage breathes in.`},
  {t:'Review every contract and direct debit',fx:{cash:2.5,you:-2},o:`You find £2,500 of savings, including a subscription to a magazine about hospital car parks.`},
  {t:'Thank Neville and change nothing',fx:{you:1},o:`He nods, in a way that means "I'll send you an email you won't read".`}
 ]},

{id:'pension',who:'pcse',title:'The pension record',tag:'story',
 text:`Your pension record says your contributions for last year are "missing". The form they need was withdrawn in 2023. The helpline hold music is Vivaldi's Four Seasons. All four.`,
 choices:[
  {t:'Spend an evening fixing it',fx:{you:-3},o:`Ninety minutes of hold music later, a lovely woman called Janet fixes it. You nearly send Janet flowers.`},
  {t:'Future you can deal with it',fx:{you:1},later:[{in:4,p:1,fx:{you:-5},note:'Your pension record now shows you as retired in 1998. Fixing it took a whole weekend.'}],o:`Future you is going to be so annoyed.`}
 ]},

{id:'hospital_discharge',who:'hospital',title:'The Christmas clear-out',months:[8],tag:'story',
 text:`It's 23rd December. St Swithin's has discharged 38 of your patients in two days to free beds. Every letter ends: "GP to follow up bloods in one week and review medications".`,
 choices:[
  {t:'Bounce the inappropriate requests back',fx:{inbox:40,team:1,safety:-1},later:[{in:1,p:1,fx:{inbox:25},note:'Half the discharge requests you bounced back in December came back to you in January anyway.'}],o:`You send a polite template about the hospital arranging its own tests.`},
  {t:'Just do them all',fx:{inbox:80,you:-4,safety:2,patients:2},o:`Raj and you work through them on Christmas Eve. Every one gets done. You eat a mince pie from the reception tin, standing up.`}
 ]}
,
{id:'hcq_screening',who:'raj',title:'Nobody booked the eye test',tag:'real',src:['S85','S86'],
 info:'Under the national shared care protocol for hydroxychloroquine, the specialist reviews the patient every year and, after five years of treatment (sooner with risk factors such as reduced kidney function or tamoxifen), refers them for annual retinal screening. The GP\'s part is to remind the specialist as the five-year mark approaches. Early retinal toxicity causes no symptoms, and severe damage can keep progressing after the drug is stopped. Whoever signs the prescription is responsible for it, so when the specialist disappears, the gap is the practice\'s.',
 text:`A medication review turns up a woman of 61 who has taken hydroxychloroquine for eight years, under shared care with a private rheumatologist. The agreement is clear: the specialist reviews her every year, and refers her for eye screening every year after five. The rheumatologist moved to Dubai three years ago. Nobody told the practice. The repeat prescription kept going out every 56 days, signed by whoever was on.`,
 choices:[
  {t:'Refer her for retinal screening now, and to NHS rheumatology',fx:{you:-2,safety:2,inbox:10},
   run(){ if(chance(0.7)) plant({in:3,fx:{safety:2},note:'Her retinal scan was normal. NHS rheumatology has taken over her care, with a new shared care agreement.'}); else plant({in:3,fx:{safety:-3,you:-3,rep:-1},note:'Her retinal scan showed early hydroxychloroquine damage. The drug has been stopped and her sight is unaffected so far, but it will be watched for years. You have logged it as a significant event.'}); },
   o:`She had no idea she was meant to be having eye checks. Nobody told her either. The referral goes today, with a letter to NHS rheumatology explaining why a private patient is now theirs.`},
  {t:'Search for everyone on shared care with a private specialist',fx:{you:-3,team:-1,safety:4,inbox:40,aim:{safety:1}},
   run(){ plant({in:3,p:0.8,fx:{safety:2},note:'The shared care search is finished. Every patient with a vanished private specialist now has an NHS referral, and the eye screening is booked.'}); },
   o:`The search finds 14 more patients prescribed under private shared care. Three have specialists who no longer answer. Each gets a referral, a letter explaining why, and a recall on the system that will outlast any of you.`},
  {t:'Stop the hydroxychloroquine until she has seen someone',fx:{safety:1,patients:-2},later:[{in:2,p:0.5,fx:{patients:-2,you:-2},note:'Her joints flared badly off hydroxychloroquine. She is waiting for NHS rheumatology, on a course of steroids from the out-of-hours doctor.'}],
   o:`The protocol says stopping is the specialist's decision. There isn't one. She leaves worried about her eyes and her joints, in that order.`},
  {t:'Keep prescribing. She seems fine.',fx:{},later:[{in:4,p:0.45,fx:{safety:-8,you:-6,rep:-3,patients:-3},note:'She noticed words missing from the middle of lines when reading. Her scan shows established retinal damage, which may keep progressing now the drug has stopped. She has complained, and your defence organisation has opened a file.'}],
   o:`Her eyes feel fine. That's the trouble with this side effect: they do, until they don't.`}
 ]}
);

/* ===================== EVENTS 4: the real calendar, crises and other endings ===================== */
const gppsPct = () => Math.round(clamp(58 + S.st.patients * 0.36 + (S.rep - 55) * 0.1, 40, 96));
const nonGpPayroll = () => ['recep','nurse','hca'].reduce((a, r) => a + ROLES[r].cost * S.staff[r], 0) + S.list * CORE_ADMIN;

EVENTS.push(
/* ---------- the calendar (scheduled) ---------- */
{id:'contract_2026',arc:1,who:'dept',title:'Contract day',tag:'real',src:['S1','S2','S25'],
 info:'The 2026/27 contract is worth £13.9bn, up 3.6% in cash terms. The global sum rose 5.5% to £130.07 per weighted patient, and practices can no longer cap online requests. GPs rejected the changes by 98.9% in a BMA referendum; the dispute began in October 2025 and formal talks were agreed in September 2026.',
 text:`1st April 2026. The new contract has landed. Global sum up 5.5% to £130.07 per weighted patient. Online requests can no longer be capped. Of the GPs who voted in the BMA's referendum, 98.9% rejected it.`,
 choices:[
  {t:'Shrug. It\'s imposed anyway.',fx:{you:-1},o:`You print the summary and file it under "things that happen to us".`},
  {t:'Back the BMA\'s dispute',fx:{team:3,icb:-4,flags:{bma:1}},o:`You sign the practice up to the campaign. The ICB notes it. The team likes that someone is saying something.`}
 ]},

{id:'pay_award',arc:1,who:'bev',title:'The pay awards',tag:'real',src:['S2','S15','S17'],
 info:'In 2026/27 doctors got 3.5% (DDRB) and Agenda for Change staff 3.3%. Salaried GPs on the model contract follow the doctors\' award. Practice staff aren\'t on Agenda for Change, and a third of practice nurses got no rise the year before. Every rise also costs 15% employer NI and, for pension members, 14.38% employer pension.',
 text:()=>`The pay awards are in: 3.5% for doctors and 3.3% for Agenda for Change staff. Your salaried GP's contract follows the doctors' award. The rest of your staff aren't on Agenda for Change, but they've noticed. Matching it costs about £${Math.round((nonGpPayroll()*0.033+ROLES.salaried.cost*S.staff.salaried*0.035)*1000).toLocaleString('en-GB')} a month.`,
 choices:[
  {t:'Match both awards',fx:{team:5,aim:{team:3}},run(){ S.payX+=nonGpPayroll()*0.033+ROLES.salaried.cost*S.staff.salaried*0.035; },o:`Everyone gets their rise in the June payroll, with arrears. People say thank you in the corridor.`},
  {t:'Doctors\' award, 2% for everyone else',fx:{team:-3},run(){ S.payX+=nonGpPayroll()*0.02+ROLES.salaried.cost*S.staff.salaried*0.035; addMod({id:'pay2',label:'Staff feel the 2% rise was a pay cut',months:6,aim:{team:-4}}); },o:`It's received with resignation, which is better than resignations. Just.`},
  {t:'Only what the contracts require',fx:{team:-7},run(){ S.payX+=ROLES.salaried.cost*S.staff.salaried*0.035; addMod({id:'pay0',label:'No pay rise for practice staff',months:9,aim:{team:-7}}); },later:[{in:3,p:0.5,fx:{staff:{nurse:-1},qof:-3},note:'Because staff got no pay rise: a practice nurse left for a Band 6 job at the hospital.'}],o:`Maureen asks to see the partners' drawings. You change the subject. She notices.`}
 ]},

{id:'survey',arc:1,who:'paper',title:'The GP Patient Survey',tag:'real',src:['S34'],
 info:'The national GP Patient Survey is published every July. In 2026, 76.7% of patients nationally described their overall experience of their practice as good, and about 57% found it easy to get through on the phone.',
 text:()=>`The GP Patient Survey is out. ${gppsPct()}% of your patients describe their overall experience as good. The national figure is 76.7%. The ${prac().paper} has made a league table.`,
 choices:[
  {t:()=>gppsPct()>=77?'Buy the team pizza':'Publish an honest action plan',fx:()=>gppsPct()>=77?{team:5,cash:-0.14}:{patients:2,rep:3,you:-2},o:()=>gppsPct()>=77?`You tell the team it's their result. It is.`:`It's specific and has dates on it. Somebody writes "LOL" on the waiting-room copy in biro. Others read it.`},
  {t:()=>gppsPct()>=77?'Put it in the newsletter':'Point out that only 84 people responded',fx:()=>gppsPct()>=77?{rep:4}:{rep:-3,you:1},o:()=>gppsPct()>=77?`Page one of the newsletter, next to the flu clinic dates.`:`Statistically you're right. Nobody cares.`}
 ]},

{id:'headline',arc:1,who:'paper',title:'The headline',tag:'real',src:['S8'],
 info:'NHS England Digital\'s 2024/25 figures: contractor GPs averaged £581,800 gross, £417,600 expenses and £164,200 income before tax. Expenses were 71.8% of the money. The median was £151,200.',
 text:`The Daily Courier: "GP PARTNERS EARN £164,200." It's the 2024/25 average, before tax and pension. The 71.8% of the money that went on staff and bills didn't make the headline.`,
 choices:[
  {t:'Post a rebuttal online',fx:{you:-3},alt:{p:0.5,fx:{you:-3,rep:-3},o:`Your thread goes viral for the wrong reasons. Someone screenshots the bit about your holiday.`},run(){ if(!S._alt) applyFx({rep:3}); },o:`Your thread explaining practice finances gets shared by 400 GPs and one surprisingly supportive journalist.`},
  {t:'Say nothing. Eat lunch.',fx:{you:2},o:`It's a good sandwich.`}
 ]},

{id:'flu_saturday',arc:1,who:'maureen',title:'Flu Saturday',tag:'real',src:['S27'],
 info:'Adult flu vaccines pay £10.06 a dose in 2026/27, the same as since 2023/24. COVID vaccines pay £8.70 a dose during the campaign. Community pharmacies compete for the same patients.',
 text:()=>{ const n=Math.round(S.list*0.058/10)*10; return `Flu season. Each adult jab pays £10.06, the same as in 2023/24. A Saturday clinic could do about ${n} jabs: £${Math.round(n*P.fluFee).toLocaleString('en-GB')} before overtime. Or the pharmacies will do them.`; },
 choices:[
  {t:'Run the Saturday clinic',fx:()=>({cash:r1(Math.round(S.list*0.058/10)*10*P.fluFee/1000-1.4),you:-4,team:-3,patients:2}),run(){ S.fluMod=1.05; },o:`Someone faints (fine). Someone brings a dog (fine). You keep your over-65s, and the flu income through the winter.`},
  {t:'Let the pharmacies have them',fx:{you:2},run(){ S.fluMod=0.75; },o:`Fewer jabs here means less vaccination income this winter.`}

{id:'winter_phones',arc:1,who:'kayleigh',title:'December',tag:'rule',src:['S1'],
 info:'Under the 2026/27 contract, urgent needs must be dealt with on the day and non-urgent ones by the end of the next working day. Telling patients to "call back tomorrow" is no longer allowed.',

 choices:[
  {t:'Partners on the phones',fx:{you:-8,patients:4,team:4},o:`You answer 61 calls before 10am. The team sees the partners on the phones. That matters.`},
  {t:'Recorded message: "call back tomorrow"',fx:{patients:-10,icb:-6,safety:-5},o:`That isn't allowed under the 2026/27 contract. The ICB hears about it by lunchtime.`}

{id:'uncapped',who:'patient',title:'Monday, 8:02am',rep:1,max:2,tag:'rule',src:['S1','S26'],
